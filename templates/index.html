<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Discharge Summary Editor</title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar no-print">

        <div class="brand">

            <h1>
                Discharge Summary Editor
            </h1>

            <p>
                Create, edit and print discharge summaries
            </p>

        </div>


        <div class="top-actions">

            <button
                type="button"
                class="secondary"
                id="randomBtn">
                Generate Random
            </button>


            <button
                type="button"
                class="secondary"
                id="resetBtn">
                New Blank Summary
            </button>


            <button
                type="button"
                class="secondary"
                id="saveBtn">
                Save in Session
            </button>


            <button
                type="button"
                class="primary"
                id="printBtn">
                Print PDF
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN DOCUMENT
    ====================================================== -->

    <main>

        <div class="paper">


            <!-- =================================================
                 HOSPITAL HEADER SPACE
            ================================================== -->

            <div class="print-header">

                <div class="hospital-header-space">
                    <!-- Blank space reserved for hospital letterhead -->
                </div>

            </div>



            <!-- =================================================
                 PATIENT / ADMISSION DETAILS
            ================================================== -->

            <section class="patient-section">

                <h2>
                    Patient / Admission Details
                </h2>


                <div
                    class="grid"
                    id="patientGrid">
                </div>

            </section>



            <!-- =================================================
                 TYPE OF DISCHARGE
                 SEPARATE FROM CLINICAL SUMMARY
            ================================================== -->

            <section class="discharge-type-section">

                <label class="discharge-type-field">

                    <span>
                        TYPE OF DISCHARGE
                    </span>


                    <input
                        type="text"
                        id="typeOfDischarge"
                        placeholder="Discharged">

                </label>

            </section>



            <!-- =================================================
                 CLINICAL SUMMARY SECTIONS
            ================================================== -->

            <section class="clinical-section">


                <div class="section-heading no-print">

                    <div>

                        <h2>
                            Clinical Summary Sections
                        </h2>

                        <p>
                            Add, edit, reorder or delete any section.
                        </p>

                    </div>


                    <button
                        type="button"
                        class="secondary"
                        id="addSectionBtn">

                        + Add Section

                    </button>

                </div>



                <!--
                    JavaScript inserts all clinical sections here.
                -->

                <div id="sections"></div>


            </section>



            <!-- =================================================
                 BOTTOM ACTIONS
            ================================================== -->

            <div class="bottom-actions no-print">


                <button
                    type="button"
                    class="secondary"
                    id="addSectionBtn2">

                    + Add Section

                </button>


                <button
                    type="button"
                    class="primary"
                    id="saveBtn2">

                    Save

                </button>


                <button
                    type="button"
                    class="pdf"
                    id="printBtn2">

                    Print / Save PDF

                </button>


            </div>



            <!-- =================================================
                 HOSPITAL FOOTER SPACE
            ================================================== -->

            <div class="print-footer">
            </div>


        </div>

    </main>

</div>



<script>

"use strict";


/* =========================================================
   APPLICATION STATE
========================================================= */

let state = {

    patient: {},

    sections: [],

    type_of_discharge: ""

};



/* =========================================================
   PATIENT FIELDS
========================================================= */

const patientFields = [

    ["patient_name", "Patient Name"],

    ["uhid", "UHID / Patient ID"],

    ["ipd_no", "IPD No."],

    ["age", "Age"],

    ["gender", "Gender"],

    ["address", "Address"],

    ["consultant", "Consultant"],

    ["department", "Department"],

    ["ward", "Ward"],

    ["bed_no", "Bed No."],

    ["admission_date", "Admission Date & Time"],

    ["discharge_date", "Discharge Date & Time"]

];



/* =========================================================
   DEFAULT CLINICAL SECTIONS
========================================================= */

const defaultClinicalSections = [

    {
        id: "section_final_diagnosis",
        title: "Final Diagnosis",
        content: ""
    },

    {
        id: "section_condition_admission",
        title: "Condition on Admission",
        content: ""
    },

    {
        id: "section_symptoms",
        title: "Symptoms / Complaints during treatment",
        content: ""
    },

    {
        id: "section_examination",
        title: "General & Systemic Examinations",
        content: ""
    },

    {
        id: "section_course",
        title: "Course in the Hospital",
        content: ""
    },

    {
        id: "section_condition_discharge",
        title: "Condition at Discharge",
        content: ""
    },

    {
        id: "section_diet",
        title: "Diet Plan",
        content: ""
    },

    {
        id: "section_followup",
        title: "Followup",
        content: ""
    },

    {
        id: "section_advice",
        title: "Advice on Discharge",
        content: ""
    }

];



/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(char) {

                return {

                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#039;"

                }[char];

            }
        );

}



/* =========================================================
   GET FRESH DEFAULT SECTIONS
========================================================= */

function getDefaultSections() {

    return defaultClinicalSections.map(
        function(section) {

            return {

                id: section.id,

                title: section.title,

                content: ""

            };

        }
    );

}



/* =========================================================
   RENDER PATIENT
========================================================= */

function renderPatient() {

    const grid =
        document.getElementById(
            "patientGrid"
        );


    grid.innerHTML = "";


    patientFields.forEach(
        function(field) {

            const key =
                field[0];

            const label =
                field[1];


            const wrapper =
                document.createElement("label");

            wrapper.className =
                "field";


            const span =
                document.createElement("span");

            span.textContent =
                label;


            const input =
                document.createElement("input");

            input.type =
                "text";

            input.dataset.patient =
                key;

            input.value =
                state.patient[key] || "";


            wrapper.appendChild(span);

            wrapper.appendChild(input);

            grid.appendChild(wrapper);

        }
    );

}



/* =========================================================
   RENDER TYPE OF DISCHARGE
========================================================= */

function renderDischargeType() {

    const input =
        document.getElementById(
            "typeOfDischarge"
        );


    if (!input) {
        return;
    }


    input.value =
        state.type_of_discharge || "";

}



/* =========================================================
   CREATE CLINICAL SECTION
========================================================= */

function createSection(section) {

    /* -----------------------------------------------
       MAIN ARTICLE
    ------------------------------------------------ */

    const article =
        document.createElement("article");


    article.className =
        "summary-section";


    article.dataset.id =
        section.id ||
        (
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2)
        );


    /* -----------------------------------------------
       SECTION CONTROLS
    ------------------------------------------------ */

    const controls =
        document.createElement("div");


    controls.className =
        "section-controls no-print";


    /* UP BUTTON */

    const upButton =
        document.createElement("button");


    upButton.type =
        "button";

    upButton.className =
        "move-up";

    upButton.title =
        "Move section up";

    upButton.textContent =
        "↑";


    /* DOWN BUTTON */

    const downButton =
        document.createElement("button");


    downButton.type =
        "button";

    downButton.className =
        "move-down";

    downButton.title =
        "Move section down";

    downButton.textContent =
        "↓";


    /* DELETE BUTTON */

    const deleteButton =
        document.createElement("button");


    deleteButton.type =
        "button";

    deleteButton.className =
        "delete-section danger";

    deleteButton.title =
        "Delete section";

    deleteButton.textContent =
        "Delete";


    controls.appendChild(
        upButton
    );

    controls.appendChild(
        downButton
    );

    controls.appendChild(
        deleteButton
    );


    article.appendChild(
        controls
    );



    /* -----------------------------------------------
       SECTION TITLE
    ------------------------------------------------ */

    const title =
        document.createElement("input");


    title.type =
        "text";

    title.className =
        "section-title";

    title.placeholder =
        "Section Title";

    title.value =
        section.title || "";


    article.appendChild(
        title
    );



    /* -----------------------------------------------
       SECTION CONTENT
    ------------------------------------------------ */

    const content =
        document.createElement("textarea");


    content.className =
        "section-content";

    content.rows =
        4;

    content.placeholder =
        "Enter clinical information...";

    content.value =
        section.content || "";


    article.appendChild(
        content
    );



    /* -----------------------------------------------
       DELETE
    ------------------------------------------------ */

    deleteButton.addEventListener(
        "click",
        function() {

            article.remove();

        }
    );



    /* -----------------------------------------------
       MOVE UP
    ------------------------------------------------ */

    upButton.addEventListener(
        "click",
        function() {

            const previous =
                article.previousElementSibling;


            if (previous) {

                article.parentElement.insertBefore(
                    article,
                    previous
                );

            }

        }
    );



    /* -----------------------------------------------
       MOVE DOWN
    ------------------------------------------------ */

    downButton.addEventListener(
        "click",
        function() {

            const next =
                article.nextElementSibling;


            if (next) {

                article.parentElement.insertBefore(
                    next,
                    article
                );

            }

        }
    );


    return article;

}



/* =========================================================
   RENDER ALL CLINICAL SECTIONS
========================================================= */

function renderSections() {

    const container =
        document.getElementById(
            "sections"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    if (
        !Array.isArray(
            state.sections
        )
    ) {

        state.sections = [];

    }


    state.sections.forEach(
        function(section) {

            const element =
                createSection(section);


            container.appendChild(
                element
            );

        }
    );

}



/* =========================================================
   ADD NEW SECTION
========================================================= */

function addSection() {

    const container =
        document.getElementById(
            "sections"
        );


    if (!container) {
        return;
    }


    const newSection = {

        id:
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2),

        title:
            "",

        content:
            ""

    };


    const element =
        createSection(
            newSection
        );


    container.appendChild(
        element
    );


    const title =
        element.querySelector(
            ".section-title"
        );


    if (title) {

        title.focus();

    }


    setTimeout(
        function() {

            element.scrollIntoView({

                behavior:
                    "smooth",

                block:
                    "center"

            });

        },
        50
    );

}



/* =========================================================
   COLLECT CURRENT PAGE DATA
========================================================= */

function collect() {

    const patient = {};


    document
        .querySelectorAll(
            "[data-patient]"
        )
        .forEach(
            function(input) {

                patient[
                    input.dataset.patient
                ] =
                    input.value;

            }
        );


    const sections = [];


    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(
            function(element, index) {

                const title =
                    element.querySelector(
                        ".section-title"
                    );

                const content =
                    element.querySelector(
                        ".section-content"
                    );


                sections.push({

                    id:
                        element.dataset.id ||
                        (
                            "section_" +
                            (index + 1)
                        ),

                    title:
                        title
                            ? title.value
                            : "",

                    content:
                        content
                            ? content.value
                            : ""

                });

            }
        );


    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    return {

        patient:
            patient,

        sections:
            sections,

        type_of_discharge:
            dischargeInput
                ? dischargeInput.value
                : ""

    };

}



/* =========================================================
   API HELPER
========================================================= */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }

    catch (error) {

        throw new Error(
            "Server returned an invalid response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}



/* =========================================================
   NORMALIZE STATE
========================================================= */

function normalizeState(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    return {

        patient:
            data.patient &&
            typeof data.patient === "object"

                ? data.patient

                : {},


        sections:
            Array.isArray(
                data.sections
            )
                ? data.sections
                : [],


        type_of_discharge:
            data.type_of_discharge || ""

    };

}



/* =========================================================
   LOAD SAVED STATE
========================================================= */

async function load() {

    try {

        const result =
            await api(
                "/api/state"
            );


        state =
            normalizeState(
                result.state
            );

    }

    catch (error) {

        console.warn(
            "Could not load saved state:",
            error
        );


        state = {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    renderPatient();

    renderDischargeType();

    renderSections();


    /*
     * If server has no sections,
     * automatically create the standard
     * blank discharge summary sections.
     */

    if (
        state.sections.length === 0
    ) {

        state.sections =
            getDefaultSections();


        renderSections();

    }

}



/* =========================================================
   NEW BLANK SUMMARY
========================================================= */

async function newBlankSummary() {

    const confirmed =
        confirm(
            "Create a new blank discharge summary?\n\n" +
            "All current information will be cleared."
        );


    if (!confirmed) {

        return;

    }


    /* -----------------------------------------------
       RESET PATIENT
    ------------------------------------------------ */

    state.patient = {};


    /* -----------------------------------------------
       RESET TYPE OF DISCHARGE
    ------------------------------------------------ */

    state.type_of_discharge = "";


    /* -----------------------------------------------
       CREATE STANDARD CLINICAL SECTIONS
    ------------------------------------------------ */

    state.sections =
        getDefaultSections();


    /* -----------------------------------------------
       RENDER EVERYTHING
    ------------------------------------------------ */

    renderPatient();

    renderDischargeType();

    renderSections();


    /* -----------------------------------------------
       SCROLL TO CLINICAL SUMMARY
    ------------------------------------------------ */

    setTimeout(
        function() {

            const clinical =
                document.querySelector(
                    ".clinical-section"
                );


            if (clinical) {

                clinical.scrollIntoView({

                    behavior:
                        "smooth",

                    block:
                        "start"

                });

            }

        },
        100
    );


    /* -----------------------------------------------
       SAVE BLANK SUMMARY TO SESSION
    ------------------------------------------------ */

    try {

        await api(
            "/api/state",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(
                        state
                    )

            }
        );

    }

    catch (error) {

        console.warn(
            "Blank summary created locally, " +
            "but server sync failed:",
            error
        );

    }


    /* -----------------------------------------------
       FOCUS FIRST CLINICAL SECTION
    ------------------------------------------------ */

    setTimeout(
        function() {

            const firstContent =
                document.querySelector(
                    "#sections .section-content"
                );


            if (firstContent) {

                firstContent.focus();

            }

        },
        200
    );

}



/* =========================================================
   SAVE
========================================================= */

async function save() {

    try {

        state =
            collect();


        const result =
            await api(
                "/api/state",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            state
                        )

                }
            );


        if (result.state) {

            state =
                normalizeState(
                    result.state
                );

        }


        alert(
            "Discharge summary saved in the current session."
        );

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Save failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   RANDOM SUMMARY
========================================================= */

async function randomize() {

    try {

        const result =
            await api(
                "/api/random",
                {
                    method:
                        "POST"
                }
            );


        state =
            normalizeState(
                result.state ||
                result
            );


        renderPatient();

        renderDischargeType();

        renderSections();


        /*
         * If random API does not return sections,
         * use standard sections.
         */

        if (
            state.sections.length === 0
        ) {

            state.sections =
                getDefaultSections();


            renderSections();

        }

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Random generation failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   PRINT
========================================================= */

function printSummary() {

    /*
     * Collect current typing before printing.
     */

    state =
        collect();


    window.print();

}



/* =========================================================
   EVENT LISTENERS
========================================================= */


/* -----------------------------------------------
   ADD SECTION - TOP
------------------------------------------------ */

document
    .getElementById(
        "addSectionBtn"
    )
    .addEventListener(
        "click",
        addSection
    );



/* -----------------------------------------------
   ADD SECTION - BOTTOM
------------------------------------------------ */

document
    .getElementById(
        "addSectionBtn2"
    )
    .addEventListener(
        "click",
        addSection
    );



/* -----------------------------------------------
   SAVE - TOP
------------------------------------------------ */

document
    .getElementById(
        "saveBtn"
    )
    .addEventListener(
        "click",
        save
    );



/* -----------------------------------------------
   SAVE - BOTTOM
------------------------------------------------ */

document
    .getElementById(
        "saveBtn2"
    )
    .addEventListener(
        "click",
        save
    );



/* -----------------------------------------------
   RANDOM
------------------------------------------------ */

document
    .getElementById(
        "randomBtn"
    )
    .addEventListener(
        "click",
        randomize
    );



/* -----------------------------------------------
   NEW BLANK SUMMARY
------------------------------------------------ */

document
    .getElementById(
        "resetBtn"
    )
    .addEventListener(
        "click",
        newBlankSummary
    );



/* -----------------------------------------------
   PRINT - TOP
------------------------------------------------ */

document
    .getElementById(
        "printBtn"
    )
    .addEventListener(
        "click",
        printSummary
    );



/* -----------------------------------------------
   PRINT - BOTTOM
------------------------------------------------ */

document
    .getElementById(
        "printBtn2"
    )
    .addEventListener(
        "click",
        printSummary
    );



/* =========================================================
   START APPLICATION
========================================================= */

load();

</script>


</body>

</html>
