<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discharge Summary Editor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>


<body>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar no-print">

        <div class="brand">

            <div class="eyebrow">
                SHREE BALAJI HOSPITAL
            </div>

            <h1>
                Discharge Summary Editor
            </h1>

            <p>
                Create, edit, reorder and print discharge summaries.
            </p>

        </div>


        <div class="top-actions">

            <button
                type="button"
                id="newBlankBtn"
                class="secondary"
            >
                New Blank Summary
            </button>


            <button
                type="button"
                id="randomBtn"
                class="secondary"
            >
                Random Data
            </button>


            <button
                type="button"
                id="saveBtn"
                class="primary"
            >
                Save
            </button>


            <button
                type="button"
                id="printBtn"
                class="pdf"
            >
                Print / PDF
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN PAPER
    ====================================================== -->

    <main>

        <div class="paper">


            <!-- =================================================
                 PRINT HEADER

                 Hidden during printing.
                 @page provides blank header space.
            ================================================== -->

            <div class="print-header no-print">

                <div class="hospital-name">
                    SHREE BALAJI HOSPITAL
                </div>

                <div class="document-title">
                    DISCHARGE SUMMARY
                </div>

            </div>



            <!-- =================================================
                 PATIENT / ADMISSION DETAILS
            ================================================== -->

            <section class="patient-section">

                <h2>
                    Patient / Admission Details
                </h2>


                <!-- JavaScript creates patient fields -->
                <div
                    id="patientFields"
                    class="grid"
                ></div>

            </section>



            <!-- =================================================
                 TYPE OF DISCHARGE

                 This is separate from clinical sections.
            ================================================== -->

            <section class="discharge-type-section">

                <div class="discharge-type-field">

                    <span>
                        Type of Discharge
                    </span>


                    <input
                        type="text"
                        id="typeOfDischarge"
                        autocomplete="off"
                    >


                    <div
                        id="printTypeOfDischarge"
                        class="print-only-text print-field-value"
                    ></div>

                </div>

            </section>



            <!-- =================================================
                 CLINICAL SUMMARY
            ================================================== -->

            <section
                id="clinical-summary"
                class="clinical-summary"
            >

                <div class="section-heading">

                    <div>

                        <h2>
                            Clinical Summary Sections
                        </h2>

                        <p>
                            Add, edit, reorder or delete sections.
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     ADD SECTION AT TOP
                ================================================== -->

                <div class="no-print add-section-area">

                    <button
                        type="button"
                        id="addSectionTop"
                        class="secondary"
                    >
                        + Add Section
                    </button>

                </div>



                <!-- =================================================
                     IMPORTANT

                     THIS MUST STAY EMPTY.

                     JavaScript creates the sections.
                ================================================== -->

                <div id="sections"></div>



                <!-- =================================================
                     ADD SECTION AT BOTTOM
                ================================================== -->

                <div class="no-print add-section-area">

                    <button
                        type="button"
                        id="addSectionBottom"
                        class="secondary"
                    >
                        + Add Section
                    </button>

                </div>

            </section>



            <!-- =================================================
                 BOTTOM ACTIONS
            ================================================== -->

            <div class="bottom-actions no-print">

                <button
                    type="button"
                    id="newBlankBottom"
                    class="secondary"
                >
                    New Blank Summary
                </button>


                <button
                    type="button"
                    id="saveBottom"
                    class="primary"
                >
                    Save
                </button>


                <button
                    type="button"
                    id="printBottom"
                    class="pdf"
                >
                    Print / PDF
                </button>

            </div>



            <!-- PRINT FOOTER SPACE -->
            <div class="print-footer"></div>

        </div>

    </main>

</div>



<script>

/* ============================================================
   PATIENT FIELDS
============================================================ */

const patientFields = [

    {
        key: "patient_name",
        label: "Patient Name"
    },

    {
        key: "uhid",
        label: "UHID / Patient ID"
    },

    {
        key: "ipd_no",
        label: "IPD No."
    },

    {
        key: "age",
        label: "Age"
    },

    {
        key: "gender",
        label: "Gender"
    },

    {
        key: "address",
        label: "Address"
    },

    {
        key: "consultant",
        label: "Consultant"
    },

    {
        key: "department",
        label: "Department"
    },

    {
        key: "ward",
        label: "Ward"
    },

    {
        key: "bed_no",
        label: "Bed No."
    },

    {
        key: "admission_date",
        label: "Admission Date"
    },

    {
        key: "discharge_date",
        label: "Discharge Date"
    }

];



/* ============================================================
   DEFAULT SECTIONS

   EXACTLY 9.
   
   DO NOT ADD ANY SECTION HERE.
============================================================ */

const defaultClinicalSections = [

    {
        id: "section_final_diagnosis",
        title: "Final Diagnosis",
        content: ""
    },

    {
        id: "section_condition_admission",
        title: "Condition on Admission",
        content: ""
    },

    {
        id: "section_symptoms",
        title: "Symptoms / Complaints during treatment",
        content: ""
    },

    {
        id: "section_examination",
        title: "General & Systemic Examinations",
        content: ""
    },

    {
        id: "section_course",
        title: "Course in the Hospital",
        content: ""
    },

    {
        id: "section_condition_discharge",
        title: "Condition at Discharge",
        content: ""
    },

    {
        id: "section_diet",
        title: "Diet Plan",
        content: ""
    },

    {
        id: "section_followup",
        title: "Followup",
        content: ""
    },

    {
        id: "section_advice",
        title: "Advice on Discharge",
        content: ""
    }

];



/* ============================================================
   GET FRESH COPY OF DEFAULT SECTIONS

   A completely new array is created every time.
============================================================ */

function getDefaultSections() {

    return defaultClinicalSections.map(function(section) {

        return {

            id: section.id,

            title: section.title,

            content: ""

        };

    });

}



/* ============================================================
   STATE
============================================================ */

let state = {

    patient: {},

    type_of_discharge: "",

    sections: []

};



/* ============================================================
   NORMALIZE STATE
============================================================ */

function normalizeState(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return {

            patient: {},

            type_of_discharge: "",

            sections: []

        };

    }


    let patient = {};

    if (
        data.patient &&
        typeof data.patient === "object"
    ) {

        patient = data.patient;

    }


    let typeOfDischarge = "";

    if (
        typeof data.type_of_discharge === "string"
    ) {

        typeOfDischarge =
            data.type_of_discharge;

    }


    let sections = [];

    if (
        Array.isArray(data.sections)
    ) {

        sections =
            data.sections

                .filter(function(section) {

                    return (
                        section &&
                        typeof section === "object"
                    );

                })

                .map(function(section, index) {

                    return {

                        id:
                            section.id ||
                            (
                                "section_" +
                                Date.now() +
                                "_" +
                                index
                            ),

                        title:
                            typeof section.title === "string"
                                ? section.title
                                : "",

                        content:
                            typeof section.content === "string"
                                ? section.content
                                : ""

                    };

                });

    }


    return {

        patient: patient,

        type_of_discharge:
            typeOfDischarge,

        sections: sections

    };

}



/* ============================================================
   RENDER PATIENT
============================================================ */

function renderPatient() {

    const container =
        document.getElementById(
            "patientFields"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    patientFields.forEach(function(field) {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "field";


        const label =
            document.createElement("span");

        label.textContent =
            field.label;


        const input =
            document.createElement("input");

        input.type = "text";

        input.autocomplete = "off";

        input.dataset.patientKey =
            field.key;


        input.value =
            state.patient[field.key] || "";


        const printValue =
            document.createElement("div");

        printValue.className =
            "print-only-text print-field-value";


        printValue.dataset.printPatient =
            field.key;


        printValue.textContent =
            input.value;


        input.addEventListener(
            "input",
            function() {

                state.patient[field.key] =
                    input.value;


                printValue.textContent =
                    input.value;

            }
        );


        wrapper.appendChild(label);

        wrapper.appendChild(input);

        wrapper.appendChild(printValue);


        container.appendChild(wrapper);

    });

}



/* ============================================================
   RENDER TYPE OF DISCHARGE
============================================================ */

function renderDischargeType() {

    const input =
        document.getElementById(
            "typeOfDischarge"
        );


    const printValue =
        document.getElementById(
            "printTypeOfDischarge"
        );


    if (!input) {
        return;
    }


    input.value =
        state.type_of_discharge || "";


    if (printValue) {

        printValue.textContent =
            input.value;

    }


    input.oninput =
        function() {

            state.type_of_discharge =
                input.value;


            if (printValue) {

                printValue.textContent =
                    input.value;

            }

        };

}



/* ============================================================
   CREATE SECTION

   ONLY renderSections() calls this.
============================================================ */

function createSection(
    section,
    index
) {

    const article =
        document.createElement("article");


    article.className =
        "summary-section";


    article.dataset.index =
        index;



    /* ========================================================
       CONTROLS
    ======================================================== */

    const controls =
        document.createElement("div");


    controls.className =
        "section-controls no-print";



    /* UP */

    const upButton =
        document.createElement("button");


    upButton.type = "button";

    upButton.textContent = "↑";

    upButton.title =
        "Move section up";


    upButton.addEventListener(
        "click",
        function() {

            moveSection(
                index,
                -1
            );

        }
    );



    /* DOWN */

    const downButton =
        document.createElement("button");


    downButton.type = "button";

    downButton.textContent = "↓";

    downButton.title =
        "Move section down";


    downButton.addEventListener(
        "click",
        function() {

            moveSection(
                index,
                1
            );

        }
    );



    /* DELETE */

    const deleteButton =
        document.createElement("button");


    deleteButton.type = "button";

    deleteButton.className =
        "danger";

    deleteButton.textContent =
        "Delete";


    deleteButton.addEventListener(
        "click",
        function() {

            deleteSection(index);

        }
    );


    controls.appendChild(
        upButton
    );

    controls.appendChild(
        downButton
    );

    controls.appendChild(
        deleteButton
    );



    /* ========================================================
       TITLE
    ======================================================== */

    const titleInput =
        document.createElement("input");


    titleInput.type =
        "text";


    titleInput.className =
        "section-title";


    titleInput.value =
        section.title || "";


    titleInput.placeholder =
        "Section title";


    const printTitle =
        document.createElement("div");


    printTitle.className =
        "print-only-text print-section-title";


    printTitle.textContent =
        titleInput.value;


    titleInput.addEventListener(
        "input",
        function() {

            if (state.sections[index]) {

                state.sections[index].title =
                    titleInput.value;

            }


            printTitle.textContent =
                titleInput.value;

        }
    );



    /* ========================================================
       CONTENT
    ======================================================== */

    const contentTextarea =
        document.createElement("textarea");


    contentTextarea.className =
        "section-content";


    contentTextarea.value =
        section.content || "";


    contentTextarea.placeholder =
        "Enter details...";


    const printContent =
        document.createElement("div");


    printContent.className =
        "print-only-text print-section-content";


    printContent.textContent =
        contentTextarea.value;


    contentTextarea.addEventListener(
        "input",
        function() {

            if (state.sections[index]) {

                state.sections[index].content =
                    contentTextarea.value;

            }


            printContent.textContent =
                contentTextarea.value;

        }
    );



    /* ========================================================
       ADD TO SECTION
    ======================================================== */

    article.appendChild(
        controls
    );

    article.appendChild(
        titleInput
    );

    article.appendChild(
        printTitle
    );

    article.appendChild(
        contentTextarea
    );

    article.appendChild(
        printContent
    );


    return article;

}



/* ============================================================
   RENDER SECTIONS

   IMPORTANT:
   1. Clear container.
   2. Render state.sections ONLY.
   3. Never append default sections here.
============================================================ */

function renderSections() {

    const container =
        document.getElementById(
            "sections"
        );


    if (!container) {

        console.error(
            "Sections container not found."
        );

        return;

    }


    /*
     * REMOVE EVERYTHING FIRST.
     *
     * This is what prevents duplicate
     * Final Diagnosis sections.
     */

    container.innerHTML = "";


    /*
     * Only render the sections already
     * present in state.
     */

    if (
        !Array.isArray(
            state.sections
        )
    ) {

        state.sections = [];

    }


    state.sections.forEach(
        function(section, index) {

            const element =
                createSection(
                    section,
                    index
                );


            container.appendChild(
                element
            );

        }
    );

}



/* ============================================================
   MOVE SECTION
============================================================ */

function moveSection(
    index,
    direction
) {

    const newIndex =
        index + direction;


    if (
        newIndex < 0 ||
        newIndex >= state.sections.length
    ) {

        return;

    }


    const temp =
        state.sections[index];


    state.sections[index] =
        state.sections[newIndex];


    state.sections[newIndex] =
        temp;


    renderSections();

}



/* ============================================================
   DELETE SECTION
============================================================ */

function deleteSection(index) {

    if (
        index < 0 ||
        index >= state.sections.length
    ) {

        return;

    }


    const title =
        state.sections[index].title ||
        "this section";


    if (
        !confirm(
            'Delete "' +
            title +
            '"?'
        )
    ) {

        return;

    }


    state.sections.splice(
        index,
        1
    );


    renderSections();

}



/* ============================================================
   ADD SECTION
============================================================ */

function addSection(
    position = null
) {

    const newSection = {

        id:
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8),

        title:
            "New Section",

        content:
            ""

    };


    /*
     * Add at bottom.
     */

    if (
        position === null
    ) {

        state.sections.push(
            newSection
        );

    }

    /*
     * Add at a specific position.
     */

    else {

        state.sections.splice(
            position,
            0,
            newSection
        );

    }


    renderSections();


    setTimeout(
        function() {

            const titles =
                document.querySelectorAll(
                    "#sections .section-title"
                );


            if (
                position === null
            ) {

                const last =
                    titles[
                        titles.length - 1
                    ];


                if (last) {

                    last.focus();

                }

            }

            else {

                if (titles[position]) {

                    titles[position].focus();

                }

            }

        },
        50
    );

}



/* ============================================================
   COLLECT CURRENT FORM DATA
============================================================ */

function collectState() {

    const patient = {};


    document
        .querySelectorAll(
            "[data-patient-key]"
        )
        .forEach(
            function(input) {

                patient[
                    input.dataset.patientKey
                ] =
                    input.value;

            }
        );


    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    const sections = [];


    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(
            function(article, index) {

                const title =
                    article.querySelector(
                        ".section-title"
                    );


                const content =
                    article.querySelector(
                        ".section-content"
                    );


                sections.push({

                    id:
                        state.sections[index]?.id ||
                        (
                            "section_" +
                            Date.now() +
                            "_" +
                            index
                        ),

                    title:
                        title
                            ? title.value
                            : "",

                    content:
                        content
                            ? content.value
                            : ""

                });

            }
        );


    return {

        patient:
            patient,

        type_of_discharge:
            dischargeInput
                ? dischargeInput.value
                : "",

        sections:
            sections

    };

}



/* ============================================================
   SAVE
============================================================ */

async function saveState(
    showMessage = true
) {

    state =
        normalizeState(
            collectState()
        );


    try {

        const response =
            await fetch(
                "/api/state",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            state
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                "Save failed"
            );

        }


        if (showMessage) {

            alert(
                "Discharge summary saved."
            );

        }

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Could not save the discharge summary."
        );

    }

}



/* ============================================================
   NEW BLANK SUMMARY

   THIS IS THE IMPORTANT FIX.

   It ALWAYS creates exactly 9 sections.

   It DOES NOT load old sections.

   It DOES NOT append sections.

   It REPLACES the entire state.
============================================================ */

async function newBlankSummary() {

    if (
        !confirm(
            "Create a new blank discharge summary?"
        )
    ) {

        return;

    }


    /* ========================================================
       COMPLETELY REPLACE STATE
    ======================================================== */

    state = {

        patient: {},

        type_of_discharge: "",

        sections:
            getDefaultSections()

    };


    /*
     * At this point state.sections contains
     * EXACTLY 9 sections.
     */


    console.log(
        "NEW BLANK SUMMARY:",
        state.sections
    );


    /* ========================================================
       CLEAR OLD DOM
    ======================================================== */

    const container =
        document.getElementById(
            "sections"
        );


    if (container) {

        container.innerHTML = "";

    }


    /* ========================================================
       RENDER NEW STATE ONLY
    ======================================================== */

    renderPatient();

    renderDischargeType();

    renderSections();


    /*
     * IMPORTANT:
     * Do NOT call loadState() here.
     *
     * Do NOT call renderSections() with default
     * sections again.
     */


    /* ========================================================
       SAVE NEW BLANK STATE
    ======================================================== */

    try {

        const response =
            await fetch(
                "/api/state",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            state
                        )
                }
            );


        if (!response.ok) {

            console.error(
                "Blank state could not be saved."
            );

        }

    }

    catch (error) {

        console.error(
            "Could not save blank state:",
            error
        );

    }


    /* ========================================================
       SCROLL
    ======================================================== */

    const clinical =
        document.getElementById(
            "clinical-summary"
        );


    if (clinical) {

        clinical.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }


    /* ========================================================
       FOCUS FIRST CONTENT
    ======================================================== */

    setTimeout(
        function() {

            const first =
                document.querySelector(
                    "#sections .section-content"
                );


            if (first) {

                first.focus();

            }

        },
        150
    );

}



/* ============================================================
   RANDOM DATA
============================================================ */

async function randomize() {

    try {

        const response =
            await fetch(
                "/api/random",
                {
                    method: "POST"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Random data failed."
            );

        }


        const data =
            await response.json();


        state =
            normalizeState(data);


        /*
         * Random data should not accidentally
         * produce zero sections.
         */

        if (
            !Array.isArray(
                state.sections
            ) ||
            state.sections.length === 0
        ) {

            state.sections =
                getDefaultSections();

        }


        renderPatient();

        renderDischargeType();

        renderSections();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Could not generate random data."
        );

    }

}



/* ============================================================
   LOAD SAVED STATE

   ONLY USED ON INITIAL PAGE LOAD.
============================================================ */

async function loadState() {

    try {

        const response =
            await fetch(
                "/api/state"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load saved state."
            );

        }


        const data =
            await response.json();


        state =
            normalizeState(data);


        /*
         * If there is no saved summary,
         * create exactly the 9 standard sections.
         */

        if (
            !Array.isArray(
                state.sections
            ) ||
            state.sections.length === 0
        ) {

            state.sections =
                getDefaultSections();

        }


        renderPatient();

        renderDischargeType();

        renderSections();

    }

    catch (error) {

        console.error(
            "Could not load state:",
            error
        );


        /*
         * First page load with no saved data.
         */

        state = {

            patient: {},

            type_of_discharge: "",

            sections:
                getDefaultSections()

        };


        renderPatient();

        renderDischargeType();

        renderSections();

    }

}



/* ============================================================
   UPDATE PRINT VALUES
============================================================ */

function updatePrintValues() {

    /*
     * PATIENT VALUES
     */

    document
        .querySelectorAll(
            "[data-patient-key]"
        )
        .forEach(
            function(input) {

                const key =
                    input.dataset.patientKey;


                const printElement =
                    document.querySelector(
                        '[data-print-patient="' +
                        key +
                        '"]'
                    );


                if (printElement) {

                    printElement.textContent =
                        input.value;

                }

            }
        );



    /*
     * TYPE OF DISCHARGE
     */

    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    const dischargePrint =
        document.getElementById(
            "printTypeOfDischarge"
        );


    if (
        dischargeInput &&
        dischargePrint
    ) {

        dischargePrint.textContent =
            dischargeInput.value;

    }



    /*
     * CLINICAL SECTIONS
     */

    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(
            function(section) {

                const title =
                    section.querySelector(
                        ".section-title"
                    );


                const content =
                    section.querySelector(
                        ".section-content"
                    );


                const printTitle =
                    section.querySelector(
                        ".print-section-title"
                    );


                const printContent =
                    section.querySelector(
                        ".print-section-content"
                    );


                if (
                    title &&
                    printTitle
                ) {

                    printTitle.textContent =
                        title.value;

                }


                if (
                    content &&
                    printContent
                ) {

                    printContent.textContent =
                        content.value;

                }

            }
        );

}



/* ============================================================
   PRINT
============================================================ */

function printSummary() {

    /*
     * Collect latest values first.
     */

    state =
        normalizeState(
            collectState()
        );


    /*
     * Put values into real HTML text elements.
     */

    updatePrintValues();


    /*
     * Small delay allows DOM to update before
     * browser print preview opens.
     */

    setTimeout(
        function() {

            window.print();

        },
        50
    );

}
