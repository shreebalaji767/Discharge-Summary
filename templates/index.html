<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Discharge Summary Editor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar no-print">

        <div class="brand">

            <div class="eyebrow">
                SHREE BALAJI HOSPITAL
            </div>

            <h1>
                Discharge Summary Editor
            </h1>

            <p>
                Create, edit, reorder and print discharge summaries.
            </p>

        </div>


        <div class="top-actions">

            <button
                type="button"
                id="newBlankBtn"
                class="secondary"
            >
                New Blank Summary
            </button>


            <button
                type="button"
                id="randomBtn"
                class="secondary"
            >
                Random Data
            </button>


            <button
                type="button"
                id="saveBtn"
                class="primary"
            >
                Save
            </button>


            <button
                type="button"
                id="printBtn"
                class="pdf"
            >
                Print / PDF
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <div class="paper">


            <!-- =================================================
                 PRINT HEADER

                 Hidden during print because @page margin
                 provides blank hospital header space.
            ================================================== -->

            <div class="print-header no-print">

                <div class="hospital-name">
                    SHREE BALAJI HOSPITAL
                </div>

                <div class="document-title">
                    DISCHARGE SUMMARY
                </div>

            </div>



            <!-- =================================================
                 PATIENT / ADMISSION DETAILS
            ================================================== -->

            <section class="patient-section">

                <h2>
                    Patient / Admission Details
                </h2>


                <div
                    id="patientFields"
                    class="grid"
                ></div>

            </section>



            <!-- =================================================
                 TYPE OF DISCHARGE

                 Separate from Clinical Summary Sections.
            ================================================== -->

            <section class="discharge-type-section">

                <div class="discharge-type-field">

                    <span>
                        Type of Discharge
                    </span>


                    <input
                        type="text"
                        id="typeOfDischarge"
                        autocomplete="off"
                        placeholder=""
                    >


                    <!-- Printable value -->
                    <div
                        id="printTypeOfDischarge"
                        class="print-only-text print-field-value"
                    ></div>

                </div>

            </section>



            <!-- =================================================
                 CLINICAL SUMMARY
            ================================================== -->

            <section
                id="clinical-summary"
                class="clinical-summary"
            >


                <div class="section-heading">

                    <div>

                        <h2>
                            Clinical Summary Sections
                        </h2>

                        <p>
                            Add, edit, reorder or delete sections.
                        </p>

                    </div>

                </div>



                <!-- =================================================
                     ADD SECTION - TOP
                ================================================== -->

                <div class="no-print add-section-area">

                    <button
                        type="button"
                        id="addSectionTop"
                        class="secondary"
                    >
                        + Add Section
                    </button>

                </div>



                <!-- =================================================
                     IMPORTANT

                     THIS CONTAINER MUST REMAIN EMPTY.

                     JavaScript creates all clinical sections.
                ================================================== -->

                <div id="sections"></div>



                <!-- =================================================
                     ADD SECTION - BOTTOM
                ================================================== -->

                <div class="no-print add-section-area">

                    <button
                        type="button"
                        id="addSectionBottom"
                        class="secondary"
                    >
                        + Add Section
                    </button>

                </div>


            </section>



            <!-- =================================================
                 BOTTOM ACTIONS
            ================================================== -->

            <div class="bottom-actions no-print">

                <button
                    type="button"
                    id="newBlankBottom"
                    class="secondary"
                >
                    New Blank Summary
                </button>


                <button
                    type="button"
                    id="saveBottom"
                    class="primary"
                >
                    Save
                </button>


                <button
                    type="button"
                    id="printBottom"
                    class="pdf"
                >
                    Print / PDF
                </button>

            </div>



            <!-- =================================================
                 PRINT FOOTER SPACE
            ================================================== -->

            <div class="print-footer">
                .
            </div>


        </div>

    </main>

</div>



<script>

/* ============================================================
   PATIENT FIELDS
============================================================ */

const patientFields = [

    {
        key: "patient_name",
        label: "Patient Name"
    },

    {
        key: "uhid",
        label: "UHID / Patient ID"
    },

    {
        key: "ipd_no",
        label: "IPD No."
    },

    {
        key: "age",
        label: "Age"
    },

    {
        key: "gender",
        label: "Gender"
    },

    {
        key: "address",
        label: "Address"
    },

    {
        key: "consultant",
        label: "Consultant"
    },

    {
        key: "department",
        label: "Department"
    },

    {
        key: "ward",
        label: "Ward"
    },

    {
        key: "bed_no",
        label: "Bed No."
    },

    {
        key: "admission_date",
        label: "Admission Date"
    },

    {
        key: "discharge_date",
        label: "Discharge Date"
    }

];



/* ============================================================
   DEFAULT CLINICAL SECTIONS

   EXACTLY 9 SECTIONS
============================================================ */

const defaultClinicalSections = [

    {
        id: "section_final_diagnosis",
        title: "Final Diagnosis",
        content: ""
    },

    {
        id: "section_condition_admission",
        title: "Condition on Admission",
        content: ""
    },

    {
        id: "section_symptoms",
        title: "Symptoms / Complaints during treatment",
        content: ""
    },

    {
        id: "section_examination",
        title: "General & Systemic Examinations",
        content: ""
    },

    {
        id: "section_course",
        title: "Course in the Hospital",
        content: ""
    },

    {
        id: "section_condition_discharge",
        title: "Condition at Discharge",
        content: ""
    },

    {
        id: "section_diet",
        title: "Diet Plan",
        content: ""
    },

    {
        id: "section_followup",
        title: "Followup",
        content: ""
    },

    {
        id: "section_advice",
        title: "Advice on Discharge",
        content: ""
    }

];



/* ============================================================
   APPLICATION STATE
============================================================ */

let state = {

    patient: {},

    type_of_discharge: "",

    sections: []

};



/* ============================================================
   GET FRESH DEFAULT SECTIONS
============================================================ */

function getDefaultSections() {

    return defaultClinicalSections.map(section => {

        return {

            id: section.id,

            title: section.title,

            content: ""

        };

    });

}



/* ============================================================
   NORMALIZE STATE
============================================================ */

function normalizeState(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return {

            patient: {},

            type_of_discharge: "",

            sections: []

        };

    }


    const normalized = {

        patient:
            data.patient &&
            typeof data.patient === "object"
                ? data.patient
                : {},

        type_of_discharge:
            typeof data.type_of_discharge === "string"
                ? data.type_of_discharge
                : "",

        sections:
            Array.isArray(data.sections)
                ? data.sections
                : []

    };


    normalized.sections =
        normalized.sections

            .filter(section => {

                return (
                    section &&
                    typeof section === "object"
                );

            })

            .map((section, index) => {

                return {

                    id:
                        section.id ||
                        (
                            "section_" +
                            Date.now() +
                            "_" +
                            index
                        ),

                    title:
                        typeof section.title === "string"
                            ? section.title
                            : "",

                    content:
                        typeof section.content === "string"
                            ? section.content
                            : ""

                };

            });


    return normalized;

}



/* ============================================================
   RENDER PATIENT
============================================================ */

function renderPatient() {

    const container =
        document.getElementById(
            "patientFields"
        );


    if (!container) {
        return;
    }


    container.innerHTML = "";


    patientFields.forEach(field => {

        const wrapper =
            document.createElement("div");

        wrapper.className = "field";


        const label =
            document.createElement("span");

        label.textContent =
            field.label;


        const input =
            document.createElement("input");

        input.type = "text";

        input.autocomplete = "off";

        input.dataset.patientKey =
            field.key;

        input.value =
            state.patient[field.key] || "";


        /* Printable value */

        const printValue =
            document.createElement("div");

        printValue.className =
            "print-only-text print-field-value";


        printValue.dataset.printPatient =
            field.key;


        printValue.textContent =
            input.value;


        /* Update */

        input.addEventListener(
            "input",
            () => {

                state.patient[field.key] =
                    input.value;


                printValue.textContent =
                    input.value;

            }
        );


        wrapper.appendChild(label);

        wrapper.appendChild(input);

        wrapper.appendChild(printValue);

        container.appendChild(wrapper);

    });

}



/* ============================================================
   RENDER TYPE OF DISCHARGE
============================================================ */

function renderDischargeType() {

    const input =
        document.getElementById(
            "typeOfDischarge"
        );


    const printValue =
        document.getElementById(
            "printTypeOfDischarge"
        );


    if (!input) {
        return;
    }


    input.value =
        state.type_of_discharge || "";


    if (printValue) {

        printValue.textContent =
            input.value;

    }


    input.oninput = function () {

        state.type_of_discharge =
            input.value;


        if (printValue) {

            printValue.textContent =
                input.value;

        }

    };

}



/* ============================================================
   CREATE ONE CLINICAL SECTION
============================================================ */

function createSection(section, index) {

    const article =
        document.createElement("article");


    article.className =
        "summary-section";


    article.dataset.index =
        index;



    /* ========================================================
       CONTROLS
    ======================================================== */

    const controls =
        document.createElement("div");


    controls.className =
        "section-controls no-print";



    /* MOVE UP */

    const moveUp =
        document.createElement("button");


    moveUp.type = "button";

    moveUp.className = "move-up";

    moveUp.textContent = "↑";

    moveUp.title =
        "Move section up";


    moveUp.addEventListener(
        "click",
        () => {

            moveSection(
                index,
                -1
            );

        }
    );



    /* MOVE DOWN */

    const moveDown =
        document.createElement("button");


    moveDown.type = "button";

    moveDown.className =
        "move-down";

    moveDown.textContent = "↓";

    moveDown.title =
        "Move section down";


    moveDown.addEventListener(
        "click",
        () => {

            moveSection(
                index,
                1
            );

        }
    );



    /* DELETE */

    const deleteButton =
        document.createElement("button");


    deleteButton.type =
        "button";


    deleteButton.className =
        "danger";


    deleteButton.textContent =
        "Delete";


    deleteButton.title =
        "Delete section";


    deleteButton.addEventListener(
        "click",
        () => {

            deleteSection(index);

        }
    );


    controls.appendChild(moveUp);

    controls.appendChild(moveDown);

    controls.appendChild(deleteButton);



    /* ========================================================
       SECTION TITLE
    ======================================================== */

    const titleInput =
        document.createElement("input");


    titleInput.type =
        "text";


    titleInput.className =
        "section-title";


    titleInput.value =
        section.title || "";


    titleInput.placeholder =
        "Section title";



    /* Printable title */

    const printTitle =
        document.createElement("div");


    printTitle.className =
        "print-only-text print-section-title";


    printTitle.textContent =
        section.title || "";



    titleInput.addEventListener(
        "input",
        () => {

            if (state.sections[index]) {

                state.sections[index].title =
                    titleInput.value;

            }


            printTitle.textContent =
                titleInput.value;

        }
    );



    /* ========================================================
       SECTION CONTENT
    ======================================================== */

    const contentTextarea =
        document.createElement("textarea");


    contentTextarea.className =
        "section-content";


    contentTextarea.value =
        section.content || "";


    contentTextarea.placeholder =
        "Enter details...";



    /* Printable content */

    const printContent =
        document.createElement("div");


    printContent.className =
        "print-only-text print-section-content";


    printContent.textContent =
        section.content || "";



    contentTextarea.addEventListener(
        "input",
        () => {

            if (state.sections[index]) {

                state.sections[index].content =
                    contentTextarea.value;

            }


            printContent.textContent =
                contentTextarea.value;

        }
    );



    /* ========================================================
       APPEND EVERYTHING
    ======================================================== */

    article.appendChild(
        controls
    );


    article.appendChild(
        titleInput
    );


    article.appendChild(
        printTitle
    );


    article.appendChild(
        contentTextarea
    );


    article.appendChild(
        printContent
    );


    return article;

}



/* ============================================================
   RENDER ALL SECTIONS

   CRITICAL:
   CLEAR CONTAINER FIRST
============================================================ */

function renderSections() {

    const container =
        document.getElementById(
            "sections"
        );


    if (!container) {

        console.error(
            "Clinical sections container not found."
        );

        return;

    }


    /*
     * REMOVE EVERYTHING FIRST.
     *
     * This prevents duplicate/blank sections.
     */

    container.innerHTML = "";


    if (
        !Array.isArray(
            state.sections
        )
    ) {

        state.sections = [];

    }


    /*
     * Create sections.
     */

    state.sections.forEach(
        (section, index) => {

            const element =
                createSection(
                    section,
                    index
                );


            container.appendChild(
                element
            );

        }
    );

}



/* ============================================================
   MOVE SECTION
============================================================ */

function moveSection(
    index,
    direction
) {

    const newIndex =
        index + direction;


    if (
        newIndex < 0 ||
        newIndex >= state.sections.length
    ) {

        return;

    }


    const temp =
        state.sections[index];


    state.sections[index] =
        state.sections[newIndex];


    state.sections[newIndex] =
        temp;


    renderSections();

}



/* ============================================================
   DELETE SECTION
============================================================ */

function deleteSection(index) {

    if (
        index < 0 ||
        index >= state.sections.length
    ) {

        return;

    }


    const section =
        state.sections[index];


    const name =
        section.title ||
        "this section";


    if (
        !confirm(
            'Delete "' +
            name +
            '"?'
        )
    ) {

        return;

    }


    state.sections.splice(
        index,
        1
    );


    renderSections();

}



/* ============================================================
   ADD SECTION
============================================================ */

function addSection(position = null) {

    const newSection = {

        id:
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 8),

        title:
            "New Section",

        content:
            ""

    };


    if (
        position === null ||
        position >= state.sections.length
    ) {

        state.sections.push(
            newSection
        );

    } else {

        state.sections.splice(
            position,
            0,
            newSection
        );

    }


    renderSections();


    setTimeout(() => {

        const titles =
            document.querySelectorAll(
                "#sections .section-title"
            );


        if (position === null) {

            const last =
                titles[
                    titles.length - 1
                ];


            if (last) {
                last.focus();
            }

        } else {

            if (titles[position]) {

                titles[position].focus();

            }

        }

    }, 50);

}



/* ============================================================
   COLLECT STATE
============================================================ */

function collectState() {

    const patient = {};


    document
        .querySelectorAll(
            "[data-patient-key]"
        )
        .forEach(input => {

            patient[
                input.dataset.patientKey
            ] =
                input.value;

        });



    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );



    const sections = [];


    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(
            (article, index) => {

                const title =
                    article.querySelector(
                        ".section-title"
                    );


                const content =
                    article.querySelector(
                        ".section-content"
                    );


                sections.push({

                    id:
                        state.sections[index]?.id ||
                        (
                            "section_" +
                            Date.now() +
                            "_" +
                            index
                        ),

                    title:
                        title
                            ? title.value
                            : "",

                    content:
                        content
                            ? content.value
                            : ""

                });

            }
        );



    return {

        patient:
            patient,

        type_of_discharge:
            dischargeInput
                ? dischargeInput.value
                : "",

        sections:
            sections

    };

}



/* ============================================================
   SAVE
============================================================ */

async function saveState(
    showMessage = true
) {

    state =
        normalizeState(
            collectState()
        );


    try {

        const response =
            await fetch(
                "/api/state",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(
                            state
                        )
                }
            );


        if (!response.ok) {

            throw new Error(
                "Save failed"
            );

        }


        if (showMessage) {

            alert(
                "Discharge summary saved."
            );

        }

    } catch (error) {

        console.error(error);


        alert(
            "Could not save the discharge summary."
        );

    }

}



/* ============================================================
   NEW BLANK SUMMARY

   ALWAYS CREATES EXACTLY 9 SECTIONS
============================================================ */

async function newBlankSummary() {

    if (
        !confirm(
            "Create a new blank discharge summary?"
        )
    ) {

        return;

    }


    /* ========================================================
       COMPLETELY RESET STATE
    ======================================================== */

    state = {

        patient: {},

        type_of_discharge: "",

        sections:
            getDefaultSections()

    };


    /* ========================================================
       CLEAR EXISTING HTML SECTIONS
    ======================================================== */

    const container =
        document.getElementById(
            "sections"
        );


    if (container) {

        container.innerHTML = "";

    }


    /* ========================================================
       RENDER
    ======================================================== */

    renderPatient();

    renderDischargeType();

    renderSections();



    /* ========================================================
       SAVE BLANK STATE
    ======================================================== */

    try {

        await fetch(
            "/api/state",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(
                        state
                    )
            }
        );

    } catch (error) {

        console.error(
            "Could not save blank state:",
            error
        );

    }



    /* ========================================================
       SCROLL TO CLINICAL SUMMARY
    ======================================================== */

    const clinical =
        document.getElementById(
            "clinical-summary"
        );


    if (clinical) {

        clinical.scrollIntoView({

            behavior: "smooth",

            block: "start"

        });

    }



    /* ========================================================
       FOCUS FIRST SECTION
    ======================================================== */

    setTimeout(() => {

        const first =
            document.querySelector(
                "#sections .section-content"
            );


        if (first) {

            first.focus();

        }

    }, 150);

}



/* ============================================================
   RANDOM DATA
============================================================ */

async function randomize() {

    try {

        const response =
            await fetch(
                "/api/random",
                {
                    method: "POST"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Random data request failed."
            );

        }


        const data =
            await response.json();


        state =
            normalizeState(data);


        if (
            !Array.isArray(
                state.sections
            ) ||
            state.sections.length === 0
        ) {

            state.sections =
                getDefaultSections();

        }


        renderPatient();

        renderDischargeType();

        renderSections();


    } catch (error) {

        console.error(error);


        alert(
            "Could not generate random data."
        );

    }

}



/* ============================================================
   LOAD SAVED STATE
============================================================ */

async function loadState() {

    try {

        const response =
            await fetch(
                "/api/state"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load state."
            );

        }


        const data =
            await response.json();


        state =
            normalizeState(data);


        /*
         * No saved sections:
         * create the 9 standard sections.
         */

        if (
            !Array.isArray(
                state.sections
            ) ||
            state.sections.length === 0
        ) {

            state.sections =
                getDefaultSections();

        }


        renderPatient();

        renderDischargeType();

        renderSections();


    } catch (error) {

        console.error(
            "Could not load state:",
            error
        );


        state = {

            patient: {},

            type_of_discharge: "",

            sections:
                getDefaultSections()

        };


        renderPatient();

        renderDischargeType();

        renderSections();

    }

}



/* ============================================================
   UPDATE PRINT TEXT
============================================================ */

function updatePrintValues() {

    /*
     * Patient fields
     */

    document
        .querySelectorAll(
            "[data-patient-key]"
        )
        .forEach(input => {

            const key =
                input.dataset.patientKey;


            const printElement =
                document.querySelector(
                    '[data-print-patient="' +
                    key +
                    '"]'
                );


            if (printElement) {

                printElement.textContent =
                    input.value;

            }

        });



    /*
     * Type of discharge
     */

    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    const dischargePrint =
        document.getElementById(
            "printTypeOfDischarge"
        );


    if (
        dischargeInput &&
        dischargePrint
    ) {

        dischargePrint.textContent =
            dischargeInput.value;

    }



    /*
     * Clinical sections
     */

    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(section => {

            const title =
                section.querySelector(
                    ".section-title"
                );


            const content =
                section.querySelector(
                    ".section-content"
                );


            const printTitle =
                section.querySelector(
                    ".print-section-title"
                );


            const printContent =
                section.querySelector(
                    ".print-section-content"
                );


            if (
                title &&
                printTitle
            ) {

                printTitle.textContent =
                    title.value;

            }


            if (
                content &&
                printContent
            ) {

                printContent.textContent =
                    content.value;

            }

        });

}



/* ============================================================
   PRINT SUMMARY

   THIS IS THE IMPORTANT PRINT FUNCTION.
============================================================ */

function printSummary() {

    /*
     * First collect everything currently visible
     * in the editor.
     */

    state =
        normalizeState(
            collectState()
        );


    /*
     * Make absolutely sure the printable elements
     * contain the current values.
     */

    updatePrintValues();


    /*
     * Give browser a moment to update the DOM.
     */

    setTimeout(() => {

        window.print();

    }, 50);

}



/* ============================================================
   AFTER PRINT
============================================================ */

window.addEventListener(
    "afterprint",
    () => {

        /*
         * Refresh printable text from editor
         * after returning from print.
         */

        updatePrintValues();

    }
);



/* ============================================================
   EVENT LISTENERS
============================================================ */


/* New Blank - top */

document
    .getElementById(
        "newBlankBtn"
    )
    .addEventListener(
        "click",
        newBlankSummary
    );



/* New Blank - bottom */

document
    .getElementById(
        "newBlankBottom"
    )
    .addEventListener(
        "click",
        newBlankSummary
    );



/* Random */

document
    .getElementById(
        "randomBtn"
    )
    .addEventListener(
        "click",
        randomize
    );



/* Save - top */

document
    .getElementById(
        "saveBtn"
    )
    .addEventListener(
        "click",
        () => {

            saveState(true);

        }
    );

document

        "saveBottom"

        () => {

            saveState(true);

        }
    );



/* Print - top */

document
    .getElementById(
        "printBtn"
    )

document

    )
