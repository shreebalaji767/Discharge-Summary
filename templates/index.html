<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Discharge Summary Editor</title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>

<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar no-print">

        <div class="brand">

            <h1>
                Discharge Summary Editor
            </h1>

            <p>
                Create, edit and print discharge summaries
            </p>

        </div>


        <div class="top-actions">

            <button
                type="button"
                class="secondary"
                id="randomBtn">

                Generate Random

            </button>


            <button
                type="button"
                class="secondary"
                id="resetBtn">

                New Blank Summary

            </button>


            <button
                type="button"
                class="secondary"
                id="saveBtn">

                Save in Session

            </button>


            <button
                type="button"
                class="primary"
                id="printBtn">

                Print PDF

            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <div class="paper">


            <!-- =================================================
                 BLANK HEADER SPACE
            ================================================== -->

            <div class="print-header">

                <div class="hospital-header-space">
                    <!--
                        Reserved for hospital letterhead.
                        Keep blank.
                    -->
                </div>

            </div>



            <!-- =================================================
                 PATIENT / ADMISSION DETAILS
            ================================================== -->

            <section class="patient-section">

                <h2>
                    Patient / Admission Details
                </h2>


                <div
                    class="grid"
                    id="patientGrid">

                </div>

            </section>



            <!-- =================================================
                 TYPE OF DISCHARGE
                 
                 SEPARATE FROM CLINICAL SECTIONS
            ================================================== -->

            <section class="discharge-type-section">

                <label class="discharge-type-field">

                    <span>
                        TYPE OF DISCHARGE
                    </span>


                    <input
                        type="text"
                        id="typeOfDischarge"
                        placeholder="Discharged">

                </label>

            </section>



            <!-- =================================================
                 CLINICAL SUMMARY SECTIONS
            ================================================== -->

            <section class="clinical-section">


                <div class="section-heading no-print">


                    <div>

                        <h2>
                            Clinical Summary Sections
                        </h2>


                        <p>
                            Add, edit, reorder or delete any section.
                        </p>

                    </div>


                    <button
                        type="button"
                        class="secondary"
                        id="addSectionBtn">

                        + Add Section

                    </button>

                </div>



                <!--
                    Clinical sections are inserted here.
                -->

                <div id="sections"></div>


            </section>



            <!-- =================================================
                 BOTTOM ACTIONS
            ================================================== -->

            <div class="bottom-actions no-print">


                <button
                    type="button"
                    class="secondary"
                    id="addSectionBtn2">

                    + Add Section

                </button>


                <button
                    type="button"
                    class="primary"
                    id="saveBtn2">

                    Save

                </button>


                <button
                    type="button"
                    class="pdf"
                    id="printBtn2">

                    Print / Save PDF

                </button>


            </div>



            <!-- =================================================
                 BLANK FOOTER SPACE
            ================================================== -->

            <div class="print-footer">

                <!--
                    Reserved for hospital footer.
                -->

            </div>


        </div>

    </main>

</div>



<!-- =========================================================
     CLINICAL SECTION TEMPLATE
========================================================== -->

<template id="sectionTemplate">


    <article class="summary-section">


        <!-- ================================================
             SECTION CONTROLS
        ================================================= -->

        <div class="section-controls no-print">


            <button
                type="button"
                class="move-up"
                title="Move section up">

                ↑

            </button>


            <button
                type="button"
                class="move-down"
                title="Move section down">

                ↓

            </button>


            <button
                type="button"
                class="delete-section danger"
                title="Delete section">

                Delete

            </button>


        </div>



        <!-- ================================================
             SECTION TITLE
        ================================================= -->

        <input
            class="section-title"
            type="text"
            value=""
            placeholder="Section Title">



        <!-- ================================================
             SECTION CONTENT
        ================================================= -->

        <textarea
            class="section-content"
            rows="4"
            placeholder="Enter clinical information..."></textarea>


    </article>

</template>



<script>

"use strict";



/* =========================================================
   APPLICATION STATE
========================================================= */

let state = {

    patient: {},

    sections: [],

    type_of_discharge: ""

};



/* =========================================================
   PATIENT FIELDS
========================================================= */

const patientFields = [

    [
        "patient_name",
        "Patient Name"
    ],

    [
        "uhid",
        "UHID / Patient ID"
    ],

    [
        "ipd_no",
        "IPD No."
    ],

    [
        "age",
        "Age"
    ],

    [
        "gender",
        "Gender"
    ],

    [
        "address",
        "Address"
    ],

    [
        "consultant",
        "Consultant"
    ],

    [
        "department",
        "Department"
    ],

    [
        "ward",
        "Ward"
    ],

    [
        "bed_no",
        "Bed No."
    ],

    [
        "admission_date",
        "Admission Date & Time"
    ],

    [
        "discharge_date",
        "Discharge Date & Time"
    ]

];



/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(char) {

                return {

                    "&": "&amp;",

                    "<": "&lt;",

                    ">": "&gt;",

                    '"': "&quot;",

                    "'": "&#039;"

                }[char];

            }
        );

}



/* =========================================================
   RENDER PATIENT DETAILS
========================================================= */

function renderPatient() {

    const grid =
        document.getElementById(
            "patientGrid"
        );


    grid.innerHTML =
        patientFields
            .map(
                function([key, label]) {

                    return `

                        <label class="field">

                            <span>
                                ${esc(label)}
                            </span>

                            <input
                                type="text"
                                data-patient="${esc(key)}"
                                value="${esc(
                                    state.patient[key] || ""
                                )}">

                        </label>

                    `;

                }
            )
            .join("");

}



/* =========================================================
   RENDER TYPE OF DISCHARGE
========================================================= */

function renderDischargeType() {

    const input =
        document.getElementById(
            "typeOfDischarge"
        );


    if (!input) {

        return;

    }


    input.value =
        state.type_of_discharge || "";

}



/* =========================================================
   CREATE CLINICAL SECTION
========================================================= */

function createSection(section) {

    const template =
        document.getElementById(
            "sectionTemplate"
        );


    const element =
        template
            .content
            .firstElementChild
            .cloneNode(true);



    /* =====================================================
       UNIQUE ID
    ====================================================== */

    element.dataset.id =
        section.id ||
        (
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2)
        );



    /* =====================================================
       TITLE
    ====================================================== */

    const title =
        element.querySelector(
            ".section-title"
        );


    title.value =
        section.title || "";



    /* =====================================================
       CONTENT
    ====================================================== */

    const content =
        element.querySelector(
            ".section-content"
        );


    content.value =
        section.content || "";



    /* =====================================================
       DELETE
    ====================================================== */

    element
        .querySelector(
            ".delete-section"
        )
        .addEventListener(
            "click",
            function() {

                element.remove();

            }
        );



    /* =====================================================
       MOVE UP
    ====================================================== */

    element
        .querySelector(
            ".move-up"
        )
        .addEventListener(
            "click",
            function() {

                const previous =
                    element.previousElementSibling;


                if (previous) {

                    element.parentElement
                        .insertBefore(
                            element,
                            previous
                        );

                }

            }
        );



    /* =====================================================
       MOVE DOWN
    ====================================================== */

    element
        .querySelector(
            ".move-down"
        )
        .addEventListener(
            "click",
            function() {

                const next =
                    element.nextElementSibling;


                if (next) {

                    element.parentElement
                        .insertBefore(
                            next,
                            element
                        );

                }

            }
        );


    return element;

}



/* =========================================================
   RENDER ALL CLINICAL SECTIONS
========================================================= */

function renderSections() {

    const container =
        document.getElementById(
            "sections"
        );


    container.innerHTML = "";


    if (!Array.isArray(state.sections)) {

        state.sections = [];

    }


    state.sections.forEach(
        function(section) {

            container.appendChild(
                createSection(section)
            );

        }
    );

}



/* =========================================================
   ADD NEW CLINICAL SECTION
========================================================= */

function addSection() {

    const container =
        document.getElementById(
            "sections"
        );


    const newSection = {

        id:
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2),

        title: "",

        content: ""

    };


    const element =
        createSection(
            newSection
        );


    container.appendChild(
        element
    );



    /* Put cursor in title */

    const title =
        element.querySelector(
            ".section-title"
        );


    if (title) {

        title.focus();

    }


    /* Scroll */

    setTimeout(
        function() {

            element.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        },
        50
    );

}



/* =========================================================
   CREATE ONE BLANK CLINICAL SECTION
========================================================= */

function createBlankClinicalSection() {

    const container =
        document.getElementById(
            "sections"
        );


    container.innerHTML = "";


    const blankSection = {

        id: "section_1",

        title: "",

        content: ""

    };


    const element =
        createSection(
            blankSection
        );


    container.appendChild(
        element
    );



    /* Focus title */

    const title =
        element.querySelector(
            ".section-title"
        );


    if (title) {

        title.focus();

    }

}



/* =========================================================
   COLLECT CURRENT FORM DATA
========================================================= */

function collect() {

    /* -----------------------------------------------------
       PATIENT
    ----------------------------------------------------- */

    const patient = {};


    document
        .querySelectorAll(
            "[data-patient]"
        )
        .forEach(
            function(input) {

                patient[
                    input.dataset.patient
                ] =
                    input.value;

            }
        );



    /* -----------------------------------------------------
       CLINICAL SECTIONS
    ----------------------------------------------------- */

    const sections = [

        ...document.querySelectorAll(
            ".summary-section"
        )

    ].map(
        function(element, index) {

            return {

                id:
                    element.dataset.id ||
                    (
                        "section_" +
                        (index + 1)
                    ),

                title:
                    element
                        .querySelector(
                            ".section-title"
                        )
                        .value,

                content:
                    element
                        .querySelector(
                            ".section-content"
                        )
                        .value

            };

        }
    );



    /* -----------------------------------------------------
       TYPE OF DISCHARGE
    ----------------------------------------------------- */

    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    const typeOfDischarge =
        dischargeInput
            ? dischargeInput.value
            : "";



    return {

        patient: patient,

        sections: sections,

        type_of_discharge:
            typeOfDischarge

    };

}



/* =========================================================
   API HELPER
========================================================= */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }

    catch (error) {

        throw new Error(
            "Server returned an invalid response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}



/* =========================================================
   NORMALIZE STATE
========================================================= */

function normalizeState(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    return {

        patient:
            data.patient &&
            typeof data.patient === "object"

                ? data.patient

                : {},


        sections:
            Array.isArray(
                data.sections
            )

                ? data.sections

                : [],


        type_of_discharge:
            data.type_of_discharge || ""

    };

}



/* =========================================================
   LOAD
========================================================= */

async function load() {

    try {

        const result =
            await api(
                "/api/state"
            );


        state =
            normalizeState(
                result.state
            );

    }

    catch (error) {

        console.warn(
            "Could not load saved state:",
            error
        );


        state = {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }



    renderPatient();

    renderDischargeType();

    renderSections();



    /*
     * If there are no sections at all,
     * automatically create one blank section.
     */

    if (
        !state.sections ||
        state.sections.length === 0
    ) {

        createBlankClinicalSection();

    }

}



/* =========================================================
   SAVE
========================================================= */

async function save() {

    try {

        state =
            collect();


        const result =
            await api(
                "/api/state",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            state
                        )

                }
            );


        state =
            normalizeState(
                result.state ||
                state
            );


        renderPatient();

        renderDischargeType();

        renderSections();



        alert(
            "Discharge summary saved in the current session."
        );

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Save failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   GENERATE RANDOM SUMMARY
========================================================= */

async function randomize() {

    try {

        const result =
            await api(
                "/api/random",
                {
                    method: "POST"
                }
            );


        if (result.state) {

            state =
                normalizeState(
                    result.state
                );

        }

        else {

            state =
                normalizeState(
                    result
                );

        }


        renderPatient();

        renderDischargeType();

        renderSections();



        /*
         * If random API doesn't return sections,
         * provide one blank section.
         */

        if (
            !state.sections ||
            state.sections.length === 0
        ) {

            createBlankClinicalSection();

        }

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Random generation failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   NEW BLANK SUMMARY
========================================================= */

async function reset() {

    const confirmed =
        confirm(
            "Create a new blank discharge summary?\n\n" +
            "All current information will be cleared."
        );


    if (!confirmed) {

        return;

    }



    /*
     * =====================================================
     * IMPORTANT
     *
     * We completely replace the current state.
     *
     * ONE blank clinical section is intentionally created.
     * =====================================================
     */

    state = {

        patient: {},

        sections: [

            {

                id: "section_1",

                title: "",

                content: ""

            }

        ],

        type_of_discharge: ""

    };



    /* Clear patient fields */

    renderPatient();



    /* Clear Type of Discharge */

    renderDischargeType();



    /* Render ONE blank clinical section */

    renderSections();



    /*
     * Scroll to the top.
     */

    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });



    /*
     * Try to save the blank state to the session.
     *
     * The page is already cleared even if this
     * server request fails.
     */

    try {

        await api(
            "/api/state",
            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(
                        state
                    )

            }
        );

    }

    catch (error) {

        console.warn(
            "Blank summary created, but server sync failed:",
            error
        );

    }



    /*
     * Focus the blank clinical section title.
     */

    setTimeout(
        function() {

            const title =
                document.querySelector(
                    ".summary-section .section-title"
                );


            if (title) {

                title.focus();

            }

        },
        100
    );

}



/* =========================================================
   PRINT
========================================================= */

function printSummary() {

    /*
     * Collect latest changes before printing.
     */

    state =
        collect();


    window.print();

}



/* =========================================================
   BUTTON EVENTS
========================================================= */


/* Add section - top */

document
    .getElementById(
        "addSectionBtn"
    )
    .addEventListener(
        "click",
        addSection
    );



/* Add section - bottom */

document
    .getElementById(
        "addSectionBtn2"
    )
    .addEventListener(
        "click",
        addSection
    );



/* Save - top */

document
    .getElementById(
        "saveBtn"
    )
    .addEventListener(
        "click",
        save
    );



/* Save - bottom */

document
    .getElementById(
        "saveBtn2"
    )
    .addEventListener(
        "click",
        save
    );



/* Random */

document
    .getElementById(
        "randomBtn"
    )
    .addEventListener(
        "click",
        randomize
    );



/* New Blank Summary */

document
    .getElementById(
        "resetBtn"
    )
    .addEventListener(
        "click",
        reset
    );



/* Print - top */

document
    .getElementById(
        "printBtn"
    )
    .addEventListener(
        "click",
        printSummary
    );



/* Print - bottom */

document
    .getElementById(
        "printBtn2"
    )
    .addEventListener(
        "click",
        printSummary
    );



/* =========================================================
   START APPLICATION
========================================================= */

load();

</script>


</body>

</html>
