<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Discharge Summary Editor</title>

    <link
        rel="stylesheet"
        href="/static/style.css">

</head>


<body>


<div class="app">


    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar no-print">

        <div class="brand">

            <h1>
                Discharge Summary Editor
            </h1>

            <p>
                Create, edit and print discharge summaries
            </p>

        </div>


        <div class="top-actions">

            <button
                type="button"
                class="secondary"
                id="randomBtn">
                Generate Random
            </button>


            <button
                type="button"
                class="secondary"
                id="resetBtn">
                New Blank Summary
            </button>


            <button
                type="button"
                class="secondary"
                id="saveBtn">
                Save in Session
            </button>


            <button
                type="button"
                class="primary"
                id="printBtn">
                Print PDF
            </button>

        </div>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>

        <div class="paper">


            <!-- =================================================
                 BLANK HEADER SPACE
            ================================================== -->

            <div class="print-header">

                <div class="hospital-header-space">
                </div>

            </div>



            <!-- =================================================
                 PATIENT / ADMISSION DETAILS
            ================================================== -->

            <section class="patient-section">

                <h2>
                    Patient / Admission Details
                </h2>


                <div
                    class="grid"
                    id="patientGrid">
                </div>

            </section>



            <!-- =================================================
                 TYPE OF DISCHARGE
            ================================================== -->

            <section class="discharge-type-section">

                <label class="discharge-type-field">

                    <span>
                        TYPE OF DISCHARGE
                    </span>


                    <input
                        type="text"
                        id="typeOfDischarge"
                        placeholder="Discharged">

                </label>

            </section>



            <!-- =================================================
                 CLINICAL SUMMARY
            ================================================== -->

            <section class="clinical-section">


                <div class="section-heading no-print">

                    <div>

                        <h2>
                            Clinical Summary Sections
                        </h2>

                        <p>
                            Add, edit, reorder or delete any section.
                        </p>

                    </div>


                    <button
                        type="button"
                        class="secondary"
                        id="addSectionBtn">

                        + Add Section

                    </button>

                </div>



                <!--
                    ALL CLINICAL SECTIONS ARE INSERTED HERE
                -->

                <div id="sections"></div>


            </section>



            <!-- =================================================
                 BOTTOM ACTIONS
            ================================================== -->

            <div class="bottom-actions no-print">


                <button
                    type="button"
                    class="secondary"
                    id="addSectionBtn2">

                    + Add Section

                </button>


                <button
                    type="button"
                    class="primary"
                    id="saveBtn2">

                    Save

                </button>


                <button
                    type="button"
                    class="pdf"
                    id="printBtn2">

                    Print / Save PDF

                </button>


            </div>



            <!-- =================================================
                 FOOTER SPACE
            ================================================== -->

            <div class="print-footer">
            </div>


        </div>

    </main>

</div>



<script>

"use strict";


/* =========================================================
   STATE
========================================================= */

let state = {

    patient: {},

    sections: [],

    type_of_discharge: ""

};



/* =========================================================
   PATIENT FIELDS
========================================================= */

const patientFields = [

    ["patient_name", "Patient Name"],

    ["uhid", "UHID / Patient ID"],

    ["ipd_no", "IPD No."],

    ["age", "Age"],

    ["gender", "Gender"],

    ["address", "Address"],

    ["consultant", "Consultant"],

    ["department", "Department"],

    ["ward", "Ward"],

    ["bed_no", "Bed No."],

    ["admission_date", "Admission Date & Time"],

    ["discharge_date", "Discharge Date & Time"]

];



/* =========================================================
   ESCAPE HTML
========================================================= */

function esc(value) {

    return String(value ?? "")
        .replace(
            /[&<>"']/g,
            function(char) {

                return {

                    "&": "&amp;",

                    "<": "&lt;",

                    ">": "&gt;",

                    '"': "&quot;",

                    "'": "&#039;"

                }[char];

            }
        );

}



/* =========================================================
   RENDER PATIENT
========================================================= */

function renderPatient() {

    const grid =
        document.getElementById("patientGrid");


    grid.innerHTML = "";


    patientFields.forEach(
        function(field) {

            const key =
                field[0];

            const label =
                field[1];


            const wrapper =
                document.createElement("label");

            wrapper.className =
                "field";


            const span =
                document.createElement("span");

            span.textContent =
                label;


            const input =
                document.createElement("input");

            input.type =
                "text";

            input.dataset.patient =
                key;

            input.value =
                state.patient[key] || "";


            wrapper.appendChild(span);

            wrapper.appendChild(input);

            grid.appendChild(wrapper);

        }
    );

}



/* =========================================================
   RENDER TYPE OF DISCHARGE
========================================================= */

function renderDischargeType() {

    const input =
        document.getElementById(
            "typeOfDischarge"
        );


    input.value =
        state.type_of_discharge || "";

}



/* =========================================================
   CREATE CLINICAL SECTION
========================================================= */

function createSection(section) {

    /*
     * CREATE ARTICLE
     */

    const article =
        document.createElement("article");

    article.className =
        "summary-section";


    article.dataset.id =
        section.id ||
        (
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2)
        );



    /* =====================================================
       CONTROLS
    ====================================================== */

    const controls =
        document.createElement("div");

    controls.className =
        "section-controls no-print";



    /* UP */

    const upButton =
        document.createElement("button");

    upButton.type =
        "button";

    upButton.className =
        "move-up";

    upButton.title =
        "Move section up";

    upButton.textContent =
        "↑";



    /* DOWN */

    const downButton =
        document.createElement("button");

    downButton.type =
        "button";

    downButton.className =
        "move-down";

    downButton.title =
        "Move section down";

    downButton.textContent =
        "↓";



    /* DELETE */

    const deleteButton =
        document.createElement("button");

    deleteButton.type =
        "button";

    deleteButton.className =
        "delete-section danger";

    deleteButton.title =
        "Delete section";

    deleteButton.textContent =
        "Delete";



    controls.appendChild(upButton);

    controls.appendChild(downButton);

    controls.appendChild(deleteButton);

    article.appendChild(controls);



    /* =====================================================
       SECTION TITLE
    ====================================================== */

    const title =
        document.createElement("input");

    title.type =
        "text";

    title.className =
        "section-title";

    title.placeholder =
        "Section Title";

    title.value =
        section.title || "";


    article.appendChild(title);



    /* =====================================================
       SECTION CONTENT
    ====================================================== */

    const content =
        document.createElement("textarea");

    content.className =
        "section-content";

    content.rows =
        4;

    content.placeholder =
        "Enter clinical information...";

    content.value =
        section.content || "";


    article.appendChild(content);



    /* =====================================================
       DELETE
    ====================================================== */

    deleteButton.onclick =
        function() {

            article.remove();

        };



    /* =====================================================
       MOVE UP
    ====================================================== */

    upButton.onclick =
        function() {

            const previous =
                article.previousElementSibling;


            if (previous) {

                article.parentElement.insertBefore(
                    article,
                    previous
                );

            }

        };



    /* =====================================================
       MOVE DOWN
    ====================================================== */

    downButton.onclick =
        function() {

            const next =
                article.nextElementSibling;


            if (next) {

                article.parentElement.insertBefore(
                    next,
                    article
                );

            }

        };


    return article;

}



/* =========================================================
   RENDER SECTIONS
========================================================= */

function renderSections() {

    const container =
        document.getElementById(
            "sections"
        );


    container.innerHTML = "";


    if (
        !Array.isArray(
            state.sections
        )
    ) {

        state.sections = [];

    }


    state.sections.forEach(
        function(section) {

            const element =
                createSection(section);


            container.appendChild(
                element
            );

        }
    );

}



/* =========================================================
   CREATE ONE BLANK SECTION
========================================================= */

function createBlankSection() {

    const container =
        document.getElementById(
            "sections"
        );


    /*
     * Remove everything currently inside
     */

    container.innerHTML = "";


    /*
     * Create exactly ONE blank section
     */

    const blankSection = {

        id:
            "section_1",

        title:
            "",

        content:
            ""

    };


    const element =
        createSection(
            blankSection
        );


    container.appendChild(
        element
    );


    /*
     * Make sure it is actually visible
     */

    element.style.display =
        "block";


    element.style.visibility =
        "visible";


    /*
     * Focus title
     */

    const title =
        element.querySelector(
            ".section-title"
        );


    if (title) {

        setTimeout(
            function() {

                title.focus();

            },
            50
        );

    }

}



/* =========================================================
   ADD SECTION
========================================================= */

function addSection() {

    const container =
        document.getElementById(
            "sections"
        );


    const section = {

        id:
            "section_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2),

        title:
            "",

        content:
            ""

    };


    const element =
        createSection(
            section
        );


    container.appendChild(
        element
    );


    const title =
        element.querySelector(
            ".section-title"
        );


    if (title) {

        title.focus();

    }


    setTimeout(
        function() {

            element.scrollIntoView({
                behavior: "smooth",
                block: "center"
            });

        },
        50
    );

}



/* =========================================================
   COLLECT DATA
========================================================= */

function collect() {

    const patient = {};


    document
        .querySelectorAll(
            "[data-patient]"
        )
        .forEach(
            function(input) {

                patient[
                    input.dataset.patient
                ] =
                    input.value;

            }
        );


    const sections = [];


    document
        .querySelectorAll(
            "#sections .summary-section"
        )
        .forEach(
            function(element, index) {

                sections.push({

                    id:
                        element.dataset.id ||
                        "section_" +
                        (index + 1),

                    title:
                        element
                            .querySelector(
                                ".section-title"
                            )
                            .value,

                    content:
                        element
                            .querySelector(
                                ".section-content"
                            )
                            .value

                });

            }
        );


    return {

        patient:
            patient,

        sections:
            sections,

        type_of_discharge:
            document
                .getElementById(
                    "typeOfDischarge"
                )
                .value

    };

}



/* =========================================================
   API
========================================================= */

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            options
        );


    let data;


    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            "Invalid server response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}



/* =========================================================
   NORMALIZE STATE
========================================================= */

function normalizeState(data) {

    if (
        !data ||
        typeof data !== "object"
    ) {

        return {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    return {

        patient:
            data.patient &&
            typeof data.patient === "object"

                ? data.patient

                : {},


        sections:
            Array.isArray(
                data.sections
            )
                ? data.sections
                : [],


        type_of_discharge:
            data.type_of_discharge || ""

    };

}



/* =========================================================
   LOAD
========================================================= */

async function load() {

    try {

        const result =
            await api(
                "/api/state"
            );


        state =
            normalizeState(
                result.state
            );

    }

    catch (error) {

        console.warn(
            "State could not be loaded:",
            error
        );


        state = {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    renderPatient();

    renderDischargeType();

    renderSections();


    /*
     * If nothing is returned by backend,
     * show ONE blank clinical section.
     */

    if (
        state.sections.length === 0
    ) {

        createBlankSection();

    }

}



/* =========================================================
   NEW BLANK SUMMARY
========================================================= */

async function newBlankSummary() {

    const confirmed =
        confirm(
            "Create a new blank discharge summary?\n\n" +
            "All current information will be cleared."
        );


    if (!confirmed) {

        return;

    }


    /*
     * COMPLETELY RESET STATE
     */

    state = {

        patient: {},

        sections: [

            {

                id:
                    "section_1",

                title:
                    "",

                content:
                    ""

            }

        ],

        type_of_discharge:
            ""

    };


    /*
     * CLEAR PATIENT
     */

    renderPatient();


    /*
     * CLEAR TYPE OF DISCHARGE
     */

    renderDischargeType();


    /*
     * VERY IMPORTANT:
     *
     * Directly create ONE blank section.
     */

    createBlankSection();


    /*
     * Scroll to Clinical Summary area
     */

    setTimeout(
        function() {

            const clinical =
                document.querySelector(
                    ".clinical-section"
                );


            if (clinical) {

                clinical.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }

        },
        100
    );


    /*
     * Save blank state to session.
     *
     * This is optional.
     * Even if server fails,
     * the page is already blank.
     */

    try {

        await api(
            "/api/state",
            {

                method:
                    "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(
                        state
                    )

            }
        );

    }

    catch (error) {

        console.warn(
            "Blank summary created locally:",
            error
        );

    }

}



/* =========================================================
   SAVE
========================================================= */

async function save() {

    try {

        state =
            collect();


        const result =
            await api(
                "/api/state",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            state
                        )

                }
            );


        if (result.state) {

            state =
                normalizeState(
                    result.state
                );

        }


        alert(
            "Discharge summary saved in the current session."
        );

    }

    catch (error) {

        alert(
            "Save failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   RANDOM
========================================================= */

async function randomize() {

    try {

        const result =
            await api(
                "/api/random",
                {
                    method:
                        "POST"
                }
            );


        state =
            normalizeState(
                result.state || result
            );


        renderPatient();

        renderDischargeType();

        renderSections();


        /*
         * If random API returns no sections,
         * create one blank section.
         */

        if (
            state.sections.length === 0
        ) {

            createBlankSection();

        }

    }

    catch (error) {

        alert(
            "Random generation failed:\n\n" +
            error.message
        );

    }

}



/* =========================================================
   PRINT
========================================================= */

function printSummary() {

    /*
     * Collect latest typing before print.
     */

    state =
        collect();


    window.print();

}



/* =========================================================
   EVENT LISTENERS
========================================================= */


/* Add section */

document
    .getElementById(
        "addSectionBtn"
    )
    .addEventListener(
        "click",
        addSection
    );


document
    .getElementById(
        "addSectionBtn2"
    )
    .addEventListener(
        "click",
        addSection
    );


/* Save */

document
    .getElementById(
        "saveBtn"
    )
    .addEventListener(
        "click",
        save
    );


document
    .getElementById(
        "saveBtn2"
    )
    .addEventListener(
        "click",
        save
    );


/* Random */

document
    .getElementById(
        "randomBtn"
    )
    .addEventListener(
        "click",
        randomize
    );


/* NEW BLANK SUMMARY */

document
    .getElementById(
        "resetBtn"
    )
    .addEventListener(
        "click",
        newBlankSummary
    );


/* Print */

document
    .getElementById(
        "printBtn"
    )
    .addEventListener(
        "click",
        printSummary
    );


document
    .getElementById(
        "printBtn2"
    )
    .addEventListener(
        "click",
        printSummary
    );



/* =========================================================
   START
========================================================= */

load();

</script>


</body>

</html>
