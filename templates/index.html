<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discharge Summary Editor</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- ==================================================
         TOP BAR
    =================================================== -->
    <header class="topbar no-print">

        <div class="brand">
            <h1>Discharge Summary Editor</h1>
            <p>Create, edit and print discharge summaries</p>
        </div>

        <div class="top-actions">

            <button
                type="button"
                class="secondary"
                id="randomBtn">
                Generate Random
            </button>

            <button
                type="button"
                class="secondary"
                id="resetBtn">
                New Blank Summary
            </button>

            <button
                type="button"
                class="secondary"
                id="saveBtn">
                Save in Session
            </button>

            <button
                type="button"
                class="primary"
                id="printBtn">
                Print PDF
            </button>

        </div>

    </header>


    <!-- ==================================================
         MAIN
    =================================================== -->
    <main>

        <div class="paper">

            <!-- ==================================================
                 BLANK HEADER SPACE
            =================================================== -->
            <div class="print-header">

                <div class="hospital-header-space">
                    <!-- Reserved for hospital letterhead -->
                </div>

            </div>


            <!-- ==================================================
                 PATIENT / ADMISSION DETAILS
            =================================================== -->
            <section class="patient-section">

                <h2>Patient / Admission Details</h2>

                <div
                    class="grid"
                    id="patientGrid">
                </div>

            </section>


            <!-- ==================================================
                 TYPE OF DISCHARGE
                 
                 IMPORTANT:
                 This is completely separate from
                 Clinical Summary Sections.
            =================================================== -->
            <section class="discharge-type-section">

                <label class="discharge-type-field">

                    <span>TYPE OF DISCHARGE</span>

                    <input
                        type="text"
                        id="typeOfDischarge"
                        placeholder="Discharged">

                </label>

            </section>


            <!-- ==================================================
                 CLINICAL SUMMARY SECTIONS
            =================================================== -->
            <section class="clinical-section">

                <div class="section-heading no-print">

                    <div>
                        <h2>Clinical Summary Sections</h2>

                        <p>
                            Add, edit, reorder or delete any section.
                        </p>
                    </div>

                    <button
                        type="button"
                        class="secondary"
                        id="addSectionBtn">
                        + Add Section
                    </button>

                </div>


                <!-- Dynamic clinical sections -->
                <div id="sections"></div>

            </section>


            <!-- ==================================================
                 BOTTOM BUTTONS
            =================================================== -->
            <div class="bottom-actions no-print">

                <button
                    type="button"
                    class="secondary"
                    id="addSectionBtn2">
                    + Add Section
                </button>

                <button
                    type="button"
                    class="primary"
                    id="saveBtn2">
                    Save
                </button>

                <button
                    type="button"
                    class="pdf"
                    id="printBtn2">
                    Print / Save PDF
                </button>

            </div>


            <!-- ==================================================
                 BLANK FOOTER SPACE
            =================================================== -->
            <div class="print-footer">
                <!-- Reserved for hospital footer -->
            </div>

        </div>

    </main>

</div>


<!-- ==================================================
     CLINICAL SECTION TEMPLATE
=================================================== -->
<template id="sectionTemplate">

    <article class="summary-section">

        <div class="section-controls no-print">

            <button
                type="button"
                class="move-up"
                title="Move section up">
                ↑
            </button>

            <button
                type="button"
                class="move-down"
                title="Move section down">
                ↓
            </button>

            <button
                type="button"
                class="delete-section danger"
                title="Delete section">
                Delete
            </button>

        </div>


        <input
            class="section-title"
            type="text"
            value=""
            placeholder="Section Title">


        <textarea
            class="section-content"
            rows="4"
            placeholder="Enter clinical information..."></textarea>

    </article>

</template>


<script>

"use strict";


/* ==================================================
   APPLICATION STATE
================================================== */

let state = {
    patient: {},
    sections: [],
    type_of_discharge: ""
};


/* ==================================================
   PATIENT FIELDS
================================================== */

const patientFields = [

    ["patient_name", "Patient Name"],

    ["uhid", "UHID / Patient ID"],

    ["ipd_no", "IPD No."],

    ["age", "Age"],

    ["gender", "Gender"],

    ["address", "Address"],

    ["consultant", "Consultant"],

    ["department", "Department"],

    ["ward", "Ward"],

    ["bed_no", "Bed No."],

    ["admission_date", "Admission Date & Time"],

    ["discharge_date", "Discharge Date & Time"]

];


/* ==================================================
   HTML ESCAPE
================================================== */

function esc(value) {

    return String(value ?? "")
        .replace(/[&<>"']/g, function(char) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[char];

        });

}


/* ==================================================
   RENDER PATIENT DETAILS
================================================== */

function renderPatient() {

    const grid =
        document.getElementById("patientGrid");

    grid.innerHTML = patientFields
        .map(function([key, label]) {

            return `
                <label class="field">

                    <span>${esc(label)}</span>

                    <input
                        type="text"
                        data-patient="${esc(key)}"
                        value="${esc(state.patient[key] || "")}"
                    >

                </label>
            `;

        })
        .join("");

}


/* ==================================================
   RENDER TYPE OF DISCHARGE
================================================== */

function renderDischargeType() {

    const input =
        document.getElementById("typeOfDischarge");

    if (!input) {
        return;
    }

    input.value =
        state.type_of_discharge || "";

}


/* ==================================================
   CREATE ONE CLINICAL SECTION
================================================== */

function createSection(section) {

    const template =
        document.getElementById("sectionTemplate");

    const element =
        template.content
            .firstElementChild
            .cloneNode(true);


    /* -----------------------------------------------
       Unique ID
    ------------------------------------------------ */

    element.dataset.id =
        section.id ||
        (
            "custom_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2)
        );


    /* -----------------------------------------------
       Title
    ------------------------------------------------ */

    const title =
        element.querySelector(".section-title");

    title.value =
        section.title || "";


    /* -----------------------------------------------
       Content
    ------------------------------------------------ */

    const content =
        element.querySelector(".section-content");

    content.value =
        section.content || "";


    /* -----------------------------------------------
       Delete
    ------------------------------------------------ */

    element
        .querySelector(".delete-section")
        .addEventListener(
            "click",
            function() {

                element.remove();

            }
        );


    /* -----------------------------------------------
       Move UP
    ------------------------------------------------ */

    element
        .querySelector(".move-up")
        .addEventListener(
            "click",
            function() {

                const previous =
                    element.previousElementSibling;

                if (previous) {

                    element.parentElement.insertBefore(
                        element,
                        previous
                    );

                }

            }
        );


    /* -----------------------------------------------
       Move DOWN
    ------------------------------------------------ */

    element
        .querySelector(".move-down")
        .addEventListener(
            "click",
            function() {

                const next =
                    element.nextElementSibling;

                if (next) {

                    element.parentElement.insertBefore(
                        next,
                        element
                    );

                }

            }
        );


    return element;

}


/* ==================================================
   RENDER ALL CLINICAL SECTIONS
================================================== */

function renderSections() {

    const container =
        document.getElementById("sections");

    container.innerHTML = "";


    if (!Array.isArray(state.sections)) {

        state.sections = [];

    }


    state.sections.forEach(function(section) {

        container.appendChild(
            createSection(section)
        );

    });

}


/* ==================================================
   ADD NEW CLINICAL SECTION
================================================== */

function addSection() {

    const container =
        document.getElementById("sections");


    const newSection = {

        id:
            "custom_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2),

        title:
            "New Section",

        content:
            ""

    };


    const element =
        createSection(newSection);


    container.appendChild(element);


    /* Scroll to new section */

    setTimeout(function() {

        element.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });


        const title =
            element.querySelector(".section-title");

        if (title) {

            title.focus();

            title.select();

        }

    }, 50);

}


/* ==================================================
   COLLECT CURRENT PAGE DATA
================================================== */

function collect() {

    /* -----------------------------------------------
       Patient
    ------------------------------------------------ */

    const patient = {};


    document
        .querySelectorAll("[data-patient]")
        .forEach(function(input) {

            patient[input.dataset.patient] =
                input.value;

        });


    /* -----------------------------------------------
       Clinical Sections
    ------------------------------------------------ */

    const sections = [
        ...document.querySelectorAll(".summary-section")
    ].map(function(element, index) {

        return {

            id:
                element.dataset.id ||
                ("custom_" + (index + 1)),

            title:
                element
                    .querySelector(".section-title")
                    .value,

            content:
                element
                    .querySelector(".section-content")
                    .value

        };

    });


    /* -----------------------------------------------
       Type of Discharge
    ------------------------------------------------ */

    const dischargeInput =
        document.getElementById(
            "typeOfDischarge"
        );


    const typeOfDischarge =
        dischargeInput
            ? dischargeInput.value
            : "";


    return {

        patient: patient,

        sections: sections,

        type_of_discharge:
            typeOfDischarge

    };

}


/* ==================================================
   API HELPER
================================================== */

async function api(url, options = {}) {

    const response =
        await fetch(url, options);


    let data;


    try {

        data =
            await response.json();

    } catch (error) {

        throw new Error(
            "Server returned an invalid response."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.error ||
            "Request failed."
        );

    }


    return data;

}


/* ==================================================
   NORMALIZE STATE
================================================== */

function normalizeState(data) {

    if (!data || typeof data !== "object") {

        return {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    return {

        patient:
            data.patient &&
            typeof data.patient === "object"
                ? data.patient
                : {},

        sections:
            Array.isArray(data.sections)
                ? data.sections
                : [],

        type_of_discharge:
            data.type_of_discharge || ""

    };

}


/* ==================================================
   LOAD EXISTING STATE
================================================== */

async function load() {

    try {

        const result =
            await api("/api/state");


        state =
            normalizeState(result.state);


    } catch (error) {

        console.warn(
            "Could not load saved state:",
            error
        );


        state = {

            patient: {},

            sections: [],

            type_of_discharge: ""

        };

    }


    renderPatient();

    renderDischargeType();

    renderSections();

}


/* ==================================================
   SAVE
================================================== */

async function save() {

    try {

        state =
            collect();


        const result =
            await api(
                "/api/state",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(state)

                }
            );


        state =
            normalizeState(
                result.state || state
            );


        renderPatient();

        renderDischargeType();

        renderSections();


        alert(
            "Discharge summary saved in the current session."
        );


    } catch (error) {

        console.error(error);


        alert(
            "Save failed:\n\n" +
            error.message
        );

    }

}


/* ==================================================
   GENERATE RANDOM SUMMARY
================================================== */

async function randomize() {

    try {

        const result =
            await api(
                "/api/random",
                {
                    method: "POST"
                }
            );


        /*
         * Some backends return the state
         * directly, while others return
         * { state: ... }.
         */

        if (result.state) {

            state =
                normalizeState(
                    result.state
                );

        } else {

            state =
                normalizeState(
                    result
                );

        }


        renderPatient();

        renderDischargeType();

        renderSections();


    } catch (error) {

        console.error(error);


        alert(
            "Random generation failed:\n\n" +
            error.message
        );

    }

}


/* ==================================================
   NEW BLANK SUMMARY
================================================== */

async function reset() {

    const confirmed =
        confirm(
            "Create a new blank discharge summary?\n\n" +
            "All current unsaved information will be cleared."
        );


    if (!confirmed) {

        return;

    }


    /*
     * IMPORTANT:
     *
     * We do NOT depend on /api/reset.
     *
     * The browser is directly reset here.
     */


    state = {

        patient: {},

        sections: [],

        type_of_discharge: ""

    };


    /* Clear patient fields */

    renderPatient();


    /* Clear Type of Discharge */

    renderDischargeType();


    /* Remove all clinical sections */

    renderSections();


    /*
     * Also try to save the blank state
     * into the current session.
     *
     * If the backend does not support it,
     * the page is still cleared.
     */

    try {

        await api(
            "/api/state",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify(state)

            }
        );

    } catch (error) {

        console.warn(
            "Blank summary created locally. " +
            "Server sync failed:",
            error
        );

    }


    /*
     * Scroll to the top of the form
     */

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==================================================
   PRINT
================================================== */

function printSummary() {

    /*
     * First collect current visible values.
     *
     * This makes sure the latest typing is
     * represented when printing.
     */

    state =
        collect();


    window.print();

}


/* ==================================================
   BUTTON EVENTS
================================================== */

document
    .getElementById("addSectionBtn")
    .addEventListener(
        "click",
        addSection
    );


document
    .getElementById("addSectionBtn2")
    .addEventListener(
        "click",
        addSection
    );


document
    .getElementById("saveBtn")
    .addEventListener(
        "click",
        save
    );


document
    .getElementById("saveBtn2")
    .addEventListener(
        "click",
        save
    );


document
    .getElementById("randomBtn")
    .addEventListener(
        "click",
        randomize
    );


document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        reset
    );


document
    .getElementById("printBtn")
    .addEventListener(
        "click",
        printSummary
    );


document
    .getElementById("printBtn2")
    .addEventListener(
        "click",
        printSummary
    );


/* ==================================================
   START APPLICATION
================================================== */

load();

</script>

</body>
</html>
