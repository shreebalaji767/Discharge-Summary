<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Discharge Summary Editor</title>

  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

  <!-- =========================
       TOP BAR
  ========================== -->
  <header class="topbar no-print">

    <div class="brand">
      <h1>Discharge Summary Editor</h1>
      <p>Create, edit and print discharge summaries</p>
    </div>

    <div class="top-actions">

      <button
        type="button"
        class="secondary"
        id="randomBtn">
        Generate Random
      </button>

      <button
        type="button"
        class="secondary"
        id="resetBtn">
        New Blank Summary
      </button>

      <button
        type="button"
        class="secondary"
        id="saveBtn">
        Save in Session
      </button>

      <button
        type="button"
        class="primary"
        id="printBtn">
        Print PDF
      </button>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->
  <main>

    <div class="paper">

      <!-- =========================
           PRINT HEADER SPACE
           Keep blank for hospital
           letterhead
      ========================== -->
      <div class="print-header">

        <div class="hospital-header-space">
          <!--
            Leave this area blank.
            Hospital letterhead will appear
            from the physical/pre-printed page.
          -->
        </div>

      </div>


      <!-- =========================
           PATIENT / ADMISSION DETAILS
      ========================== -->
      <section class="patient-section">

        <h2>Patient / Admission Details</h2>

        <div
          class="grid"
          id="patientGrid">
        </div>

      </section>


      <!-- =========================
           TYPE OF DISCHARGE
           
           IMPORTANT:
           This is independent from
           Clinical Summary Sections.
      ========================== -->
      <section class="discharge-type-section">

        <label class="discharge-type-field">

          <span>TYPE OF DISCHARGE</span>

          <input
            type="text"
            id="typeOfDischarge"
            placeholder="Discharged">

        </label>

      </section>


      <!-- =========================
           CLINICAL SUMMARY SECTIONS
      ========================== -->
      <section class="clinical-section">

        <div class="section-heading no-print">

          <div>
            <h2>Clinical Summary Sections</h2>

            <p>
              Add, edit, reorder or delete any section.
            </p>
          </div>

          <button
            type="button"
            class="secondary"
            id="addSectionBtn">
            + Add Section
          </button>

        </div>


        <!-- Dynamic sections appear here -->
        <div id="sections"></div>

      </section>


      <!-- =========================
           BOTTOM ACTIONS
      ========================== -->
      <div class="bottom-actions no-print">

        <button
          type="button"
          class="secondary"
          id="addSectionBtn2">
          + Add Section
        </button>

        <button
          type="button"
          class="primary"
          id="saveBtn2">
          Save
        </button>

        <button
          type="button"
          class="pdf"
          id="printBtn2">
          Print / Save PDF
        </button>

      </div>


      <!-- =========================
           PRINT FOOTER SPACE
      ========================== -->
      <div class="print-footer">

        <!--
          Intentionally blank.
          This space is reserved for
          hospital footer / stamp / footer
          letterhead.
        -->

      </div>

    </div>

  </main>

</div>


<!-- =====================================================
     DYNAMIC SECTION TEMPLATE
====================================================== -->
<template id="sectionTemplate">

  <article class="summary-section">

    <!-- Controls are hidden while printing -->
    <div class="section-controls no-print">

      <button
        type="button"
        class="move-up"
        title="Move section up">
        ↑
      </button>

      <button
        type="button"
        class="move-down"
        title="Move section down">
        ↓
      </button>

      <button
        type="button"
        class="delete-section danger"
        title="Delete section">
        Delete
      </button>

    </div>


    <input
      class="section-title"
      type="text"
      value=""
      placeholder="Section Title">


    <textarea
      class="section-content"
      rows="4"
      placeholder="Enter clinical information..."></textarea>

  </article>

</template>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->
<script>

"use strict";


/* =====================================================
   APPLICATION STATE
===================================================== */

let state = {
  patient: {},
  sections: [],
  type_of_discharge: ""
};


/* =====================================================
   PATIENT FIELDS
===================================================== */

const patientFields = [

  ["patient_name", "Patient Name"],

  ["uhid", "UHID / Patient ID"],

  ["ipd_no", "IPD No."],

  ["age", "Age"],

  ["gender", "Gender"],

  ["address", "Address"],

  ["consultant", "Consultant"],

  ["department", "Department"],

  ["ward", "Ward"],

  ["bed_no", "Bed No."],

  ["admission_date", "Admission Date & Time"],

  ["discharge_date", "Discharge Date & Time"]

];


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, function(char) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[char];

    });

}


/* =====================================================
   RENDER PATIENT DETAILS
===================================================== */

function renderPatient() {

  const grid =
    document.getElementById("patientGrid");

  grid.innerHTML = patientFields
    .map(function([key, label]) {

      return `
        <label class="field">

          <span>${esc(label)}</span>

          <input
            type="text"
            data-patient="${esc(key)}"
            value="${esc(state.patient[key] || "")}"
          >

        </label>
      `;

    })
    .join("");

}


/* =====================================================
   RENDER TYPE OF DISCHARGE
===================================================== */

function renderDischargeType() {

  const input =
    document.getElementById("typeOfDischarge");

  if (!input) {
    return;
  }

  input.value =
    state.type_of_discharge || "";

}


/* =====================================================
   CREATE A CLINICAL SECTION
===================================================== */

function sectionTemplate(section) {

  const template =
    document.getElementById("sectionTemplate");

  const element =
    template.content.firstElementChild.cloneNode(true);


  /* Section ID */

  element.dataset.id =
    section.id ||
    ("custom_" + Date.now() + "_" + Math.random().toString(36).slice(2));


  /* Section title */

  const title =
    element.querySelector(".section-title");

  title.value =
    section.title || "";


  /* Section content */

  const content =
    element.querySelector(".section-content");

  content.value =
    section.content || "";


  /* Delete */

  element
    .querySelector(".delete-section")
    .onclick = function() {

      element.remove();

    };


  /* Move UP */

  element
    .querySelector(".move-up")
    .onclick = function() {

      const previous =
        element.previousElementSibling;

      if (previous) {

        element.parentElement.insertBefore(
          element,
          previous
        );

      }

    };


  /* Move DOWN */

  element
    .querySelector(".move-down")
    .onclick = function() {

      const next =
        element.nextElementSibling;

      if (next) {

        element.parentElement.insertBefore(
          next,
          element
        );

      }

    };


  return element;

}


/* =====================================================
   RENDER ALL CLINICAL SECTIONS
===================================================== */

function renderSections() {

  const box =
    document.getElementById("sections");

  box.innerHTML = "";


  state.sections.forEach(function(section) {

    box.appendChild(
      sectionTemplate(section)
    );

  });

}


/* =====================================================
   ADD NEW SECTION
===================================================== */

function addSection() {

  const box =
    document.getElementById("sections");


  const section = {

    id:
      "custom_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    title:
      "New Section",

    content:
      ""

  };


  box.appendChild(
    sectionTemplate(section)
  );


  /* Scroll to new section */

  const last =
    box.lastElementChild;

  if (last) {

    last.scrollIntoView({
      behavior: "smooth",
      block: "center"
    });

    const title =
      last.querySelector(".section-title");

    if (title) {
      title.focus();
      title.select();
    }

  }

}


/* =====================================================
   COLLECT CURRENT FORM DATA
===================================================== */

function collect() {

  /* -------------------------
     Patient
  ------------------------- */

  const patient = {};


  document
    .querySelectorAll("[data-patient]")
    .forEach(function(input) {

      patient[input.dataset.patient] =
        input.value;

    });


  /* -------------------------
     Clinical Sections
  ------------------------- */

  const sections = [
    ...document.querySelectorAll(".summary-section")
  ]
    .map(function(element, index) {

      return {

        id:
          element.dataset.id ||
          ("custom_" + (index + 1)),

        title:
          element
            .querySelector(".section-title")
            .value,

        content:
          element
            .querySelector(".section-content")
            .value

      };

    });


  /* -------------------------
     Type of Discharge
  ------------------------- */

  const typeOfDischarge =
    document
      .getElementById("typeOfDischarge")
      .value;


  return {

    patient: patient,

    sections: sections,

    type_of_discharge:
      typeOfDischarge

  };

}


/* =====================================================
   API HELPER
===================================================== */

async function api(url, options = {}) {

  const response =
    await fetch(url, options);


  let data = {};

  try {

    data =
      await response.json();

  } catch (error) {

    throw new Error(
      "Invalid server response."
    );

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      "Request failed."
    );

  }


  return data;

}


/* =====================================================
   LOAD STATE
===================================================== */

async function load() {

  try {

    const result =
      await api("/api/state");


    state =
      result.state || {};


    /* Ensure properties exist */

    state.patient =
      state.patient || {};

    state.sections =
      state.sections || [];

    state.type_of_discharge =
      state.type_of_discharge || "";


    renderPatient();

    renderDischargeType();

    renderSections();


  } catch (error) {

    console.error(error);

    state = {

      patient: {},

      sections: [],

      type_of_discharge: ""

    };


    renderPatient();

    renderDischargeType();

    renderSections();

  }

}


/* =====================================================
   SAVE
===================================================== */

async function save() {

  try {

    state =
      collect();


    const result =
      await api(
        "/api/state",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(state)

        }
      );


    state =
      result.state || state;


    state.patient =
      state.patient || {};

    state.sections =
      state.sections || [];

    state.type_of_discharge =
      state.type_of_discharge || "";


    renderPatient();

    renderDischargeType();

    renderSections();


    alert(
      "Saved in current session.\n\n" +
      "No database was used."
    );


  } catch (error) {

    console.error(error);

    alert(
      "Save failed: " +
      error.message
    );

  }

}


/* =====================================================
   GENERATE RANDOM DATA
===================================================== */

async function randomize() {

  try {

    state =
      await api(
        "/api/random",
        {
          method: "POST"
        }
      );


    state.patient =
      state.patient || {};

    state.sections =
      state.sections || [];

    state.type_of_discharge =
      state.type_of_discharge || "";


    renderPatient();

    renderDischargeType();

    renderSections();


  } catch (error) {

    console.error(error);

    alert(
      "Random generation failed: " +
      error.message
    );

  }

}


/* =====================================================
   RESET / NEW BLANK SUMMARY
===================================================== */

async function reset() {

  try {

    state =
      await api(
        "/api/reset",
        {
          method: "POST"
        }
      );


    state.patient = {};

    state.sections = [];

    state.type_of_discharge = "";


    renderPatient();

    renderDischargeType();

    renderSections();


  } catch (error) {

    console.error(error);

    /* Local fallback */

    state = {

      patient: {},

      sections: [],

      type_of_discharge: ""

    };


    renderPatient();

    renderDischargeType();

    renderSections();

  }

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

document
  .getElementById("addSectionBtn")
  .addEventListener(
    "click",
    addSection
  );


document
  .getElementById("addSectionBtn2")
  .addEventListener(
    "click",
    addSection
  );


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    save
  );


document
  .getElementById("saveBtn2")
  .addEventListener(
    "click",
    save
  );


document
  .getElementById("randomBtn")
  .addEventListener(
    "click",
    randomize
  );


document
  .getElementById("resetBtn")
  .addEventListener(
    "click",
    reset
  );


document
  .getElementById("printBtn")
  .addEventListener(
    "click",
    function() {

      window.print();

    }
  );


document
  .getElementById("printBtn2")
  .addEventListener(
    "click",
    function() {

      window.print();

    }
  );


/* =====================================================
   INITIAL LOAD
===================================================== */

load();

</script>

</body>
</html>
