name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app.py

      - name: Validate JavaScript syntax
        run: |
          node --check static/js/core.js
          node --check static/js/app.js

      - name: Validate required assets
        run: |
          test -f templates/index.html
          test -f static/style.css
          test -f static/manifest.webmanifest
          test -f static/sw.js
          test -f static/icons/icon.svg
